<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E5A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="Game belajar Sirah Nabawiyah berbasis buku Ar-Rahiqul Makhtum untuk remaja dan dewasa.">
<title>Peta Sirah Nabawiyah</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#ECEFE8; --surface:#F7F9F4; --ink:#14231D; --muted:#52645B; --line:#C8D1C5;
  --green:#0E5A47; --green-soft:#D5E7DD; --ochre:#9A5F10; --ochre-soft:#F2E2C2;
  --ok:#1B6E45; --ok-soft:#D3EBDC; --bad:#A3362A; --bad-soft:#F4D9D4;
  --f-display:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1815; --surface:#16251F; --ink:#E4EDE8; --muted:#9DB1A7; --line:#2C4038;
  --green:#58C3A1; --green-soft:#1B3A31; --ochre:#E2A850; --ochre-soft:#3A2D14;
  --ok:#5FCB92; --ok-soft:#183A29; --bad:#F08A7C; --bad-soft:#40201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#16251F; --ink:#E4EDE8; --muted:#9DB1A7; --line:#2C4038;
  --green:#58C3A1; --green-soft:#1B3A31; --ochre:#E2A850; --ochre-soft:#3A2D14;
  --ok:#5FCB92; --ok-soft:#183A29; --bad:#F08A7C; --bad-soft:#40201C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top h1{font-size:clamp(28px,7vw,38px);line-height:1.1;letter-spacing:.01em}
.src{margin:0;color:var(--muted);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--green);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-weight:500;color:var(--green)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.stats{display:flex;gap:16px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.learn{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.learn input{accent-color:var(--green);width:16px;height:16px}
.band{margin:28px 0 10px;display:flex;align-items:baseline;gap:10px;color:var(--ochre)}
.band h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-body);font-weight:600}
.band::after{content:"";flex:1;border-top:1px dashed var(--line);transform:translateY(-4px)}
.route{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:0}
.route::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;border-left:2px dashed var(--line)}
.st{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px}
.node{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:14px;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.st.cur .node{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.st.done .node{border-color:var(--green);background:var(--green);color:var(--bg)}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.st.cur .card{border-color:var(--ochre)}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px}
.ttl{font-family:var(--f-display);font-size:19px;line-height:1.25}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.st.lock .card{opacity:.6}
.st.lock .head{cursor:not-allowed}
.body{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.body p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:500}
.q{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.q .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.q .qt{font-weight:600;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:0;font-size:14px}
.fb.good{color:var(--ok)}
.fb.err{color:var(--bad)}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{align-self:flex-start;background:var(--green);color:var(--bg);border:0;border-radius:6px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:flex;flex-direction:column;gap:12px}
.pool,.seq{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tl .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seq li button,.pool li button{width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.seq li button{border-color:var(--green);background:var(--green-soft)}
.seq li span.n{font-family:var(--f-mono);margin-right:8px;color:var(--green)}
.end{margin-top:24px;padding:18px;border:1px solid var(--green);border-radius:10px;background:var(--green-soft)}
.end h2{font-size:24px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:420px){.ttl{font-size:17px}.stats{gap:10px}}
:root{--sea:#CBDDDB;--land:#F2EAD3;--coast:#A9B5A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#0F2B2B;--land:#2A2B1E;--coast:#566B5E}}
:root[data-theme="dark"]{--sea:#0F2B2B;--land:#2A2B1E;--coast:#566B5E}
.st.open{grid-template-columns:minmax(0,1fr)}
.st.open .node{display:none}
.stats{flex-wrap:wrap}
.ovbox{margin-top:4px}
.ovbox summary{cursor:pointer;font-weight:600;color:var(--green);padding:6px 0}
.ovbox .map{display:block;max-width:100%;height:auto;margin-inline:auto;border-radius:8px;border:1px solid var(--line)}
.ovleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.ovleg li{display:flex;align-items:center;gap:6px}
.ovleg i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--surface)}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke}
.map .rt{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.map .rt.dash{stroke-dasharray:7 5}
.rt-a{stroke:var(--green)}.rt-b{stroke:var(--ochre)}.rt-c{stroke:var(--bad)}
.ma-a{fill:var(--green)}.ma-b{fill:var(--ochre)}.ma-c{fill:var(--bad)}
.map .pt{fill:var(--ochre);stroke:var(--surface);stroke-width:2}
.map .pt.main{fill:var(--green)}
.map .pt.ov-none{fill:var(--muted)}.map .pt.ov-part{fill:var(--ochre)}.map .pt.ov-all{fill:var(--green)}
.map .lb{font:500 12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-opacity:.9;stroke-width:3.5px;stroke-linejoin:round}
.map .rg{font:italic 12px var(--f-display);letter-spacing:.12em;fill:var(--muted);text-transform:uppercase}
.mapbox{display:flex;flex-direction:column;gap:8px}
.mapbox .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:6px 12px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.fig{margin:0;display:flex;flex-direction:column;gap:8px}
.fig .map{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.mt{font-family:var(--f-display);font-size:17px}
.leg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.leg li{display:flex;align-items:center;gap:8px}
.leg svg{flex:none}
.mn{margin:0;font-size:13px;color:var(--muted)}
.rv{padding-bottom:10px;border-bottom:1px dashed var(--line)}
.rv:last-child{border-bottom:0;padding-bottom:0}
.rv .qt{margin:0 0 4px}
.ans{margin:0 0 4px;font-size:14px;color:var(--ok);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted);font-size:13px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.badges li{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badges li.on{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ink);font-weight:600}
.chbox #ch{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.chbox #ch p{margin:0}
.chscore{font-family:var(--f-display);font-size:20px}
.chlog{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:8px}
/* ---------- Papan peta + panel ---------- */
.game{display:block;margin-top:10px}
.game>main{display:block;margin-top:10px}
.extras{margin-top:18px}
.boardw{position:sticky;top:0;z-index:5;padding-block:6px;background:var(--bg)}
#board{position:relative;height:clamp(210px,34vh,320px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sea)}
#bsv{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#bsv:active{cursor:grabbing}
.bctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.bctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;opacity:.92}
.bctl button:hover{border-color:var(--green)}
.rg.bz{font:italic 600 13px var(--f-display);letter-spacing:.14em;fill:var(--muted);text-anchor:middle;opacity:.85}
.lgc{fill:none;stroke:var(--surface);stroke-width:9;stroke-opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lg{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.45}
.lg.done{stroke:var(--green);stroke-width:4.5;stroke-dasharray:none;opacity:1}
.lg.next{stroke:var(--ochre);stroke-dasharray:3 8;opacity:1;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.nd{cursor:pointer;outline:none}
.nd .nr{fill:var(--surface);stroke:var(--line);stroke-width:3}
.nd .np{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round}
.nd .nb{fill:var(--bg)}
.nd .nt{font:600 11px var(--f-mono);fill:var(--ink);text-anchor:middle}
.nd .nl{font:600 12px var(--f-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.nd.done .nb{fill:var(--green)}.nd.done .nt{fill:var(--bg);font-size:13px}
.nd.cur .nb{fill:var(--ochre-soft)}.nd.cur .nr{stroke:var(--ochre)}.nd.cur .np{stroke:var(--ochre)}
.nd.lock{opacity:.6}
.nd.sel .nr{stroke:var(--green);stroke-width:5}
.nd .pulse{display:none;fill:none}
.nd.cur .pulse{display:block;stroke:var(--ochre);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.nd:focus-visible .nr{stroke:var(--ink);stroke-width:5}
.tk{pointer-events:none}
.tk .pin{fill:var(--ochre);stroke:var(--surface);stroke-width:2}
.tk .pdot{fill:var(--surface)}
.tk .bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pn{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;scroll-margin-top:var(--bh,0px)}
.pn.enter{animation:pnin .5s ease both}
@keyframes pnin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pnh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl{font-family:var(--f-display);font-size:22px}
.pc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stabs{display:flex;flex-wrap:wrap;gap:6px}
.stab{min-height:38px;min-width:46px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:13px}
.stab i{font-style:normal;font-size:12px}
.stab.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.stab.cur{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.stab.lock{opacity:.55}
.stab[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;font-weight:600}
.pt{font-size:20px;line-height:1.25}
.pm{margin:-6px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pn .body{border-top:1px solid var(--line)}
.bnote{margin:0;font-size:12px;color:var(--muted)}
.is-moving{opacity:.45;pointer-events:none;transition:opacity .2s}
@media (min-width:900px){
  .wrap{max-width:1120px}
  .game{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:16px}
  .game>main{margin-top:0}
  .boardw{top:12px;padding-block:0;background:transparent}
  #board{height:clamp(420px,80vh,660px)}
}
@media (prefers-reduced-motion:reduce){.nd.cur .pulse,.tk .bob,.lg.next,.pn.enter{animation:none}}
</style>
</head>

var S=[
{t:"Jazirah Arab sebelum risalah",lok:"Jazirah Arab",hlm:"1–39",
 r:{s:"Sebelum Nabi diutus, bangsa Arab hidup dalam kabilah-kabilah. Ada pemeluk Nashrani dan Majusi di beberapa wilayah, tetapi bangsa Arab pada umumnya menjadi penyembah berhala. Makkah dengan Ka’bah adalah pusat agama mereka.",
    d:"Bab pembuka memetakan posisi dan kabilah Arab, kekuasaan di Yaman, Hirah, Syam, dan Hijaz, lalu agama serta kondisi sosial, ekonomi, dan akhlak jahiliyah. Abrahah membangun gereja “Ka’bah Yaman” agar bangsa Arab berhaji ke sana, dan riwayat Abu Dawud dari Aisyah mencatat empat macam pernikahan jahiliyah."},
 k:["Kabilah Arab","Abrahah","Agama jahiliyah","Pernikahan jahiliyah"],
 q:{s:{t:"Abrahah membangun gereja bernama “Ka’bah Yaman”. Apa tujuannya?",o:["Agar bangsa Arab berhaji ke gereja itu","Sebagai benteng untuk melawan Persia","Untuk menyimpan hasil dagang Yaman"],a:0,
     e:"Abrahah menginginkan semua bangsa Arab berhaji ke gereja itu dan hendak menghancurkan Baitullah di Makkah, tetapi Allah membinasakannya.",h:"hlm. 31"},
    d:{t:"Menurut riwayat Abu Dawud dari Aisyah, pernikahan pada masa jahiliyah ada berapa macam?",o:["Dua","Tiga","Empat","Lima"],a:2,
     e:"Buku mencantumkan riwayat itu: empat macam. Yang pertama pernikahan spontan, lamaran kepada wali lalu mas kawin diserahkan seketika.",h:"hlm. 33"}}},

{t:"Kelahiran dan empat puluh tahun sebelum nubuwah",lok:"Makkah dan Syam",hlm:"40–60",
 r:{s:"Nabi lahir di Makkah dari keluarga Bani Hasyim pada Senin pagi, 9 Rabiul Awwal tahun Gajah (571 M). Beliau disusui Halimah dari Bani Sa’d, ikut Abu Thalib berdagang ke Syam pada usia 12 tahun, lalu menikah dengan Khadijah.",
    d:"Bab ini memuat masa di Bani Sa’d, asuhan kakek dan paman, rahib Bahira, Perang Fijar pada usia 15 tahun, dan Hilful-Fudhul. Pada usia 25 tahun beliau berdagang ke Syam membawa dagangan Khadijah bersama Maisarah; Khadijah saat itu berusia 40 tahun. Pada usia 35 tahun beliau menengahi perselisihan peletakan Hajar Aswad."},
 k:["Tahun Gajah","Halimah","Bahira","Hilful-Fudhul","Hajar Aswad"],
 q:{s:{t:"Quraisy berselisih tentang siapa yang berhak meletakkan Hajar Aswad. Bagaimana Nabi menyelesaikannya?",o:["Beliau menyerahkannya kepada kabilah yang paling kuat","Hajar Aswad diletakkan di atas selendang dan para pemuka kabilah mengangkatnya bersama","Beliau meletakkannya sendiri tanpa melibatkan siapa pun"],a:1,
     e:"Nabi meminta selendang, meletakkan Hajar Aswad di tengahnya, lalu meminta pemuka kabilah memegang ujung-ujungnya dan mengangkatnya bersama. Setelah dekat, beliau meletakkannya di tempat semula.",h:"hlm. 58"},
    d:{t:"Apa isi pokok perjanjian Hilful-Fudhul yang dihadiri Nabi?",o:["Pembagian hasil dagang Syam di antara kabilah","Tak seorang pun dibiarkan teraniaya, dan kezaliman harus dibalas","Larangan menikah antarkabilah","Setiap kabilah wajib memiliki berhala sendiri"],a:1,
     e:"Para kabilah sepakat tak seorang pun, penduduk Makkah atau lainnya, dibiarkan teraniaya. Setelah risalah, Nabi bersabda perjanjian itu lebih disukai daripada keledai yang terbagus.",h:"hlm. 55"}}},

{t:"Gua Hira dan wahyu pertama",lok:"Gua Hira, Jabal Nur",hlm:"61–71",
 r:{s:"Menjelang usia 40 tahun, Nabi suka menyendiri di Gua Hira di Jabal Nur, sekitar dua mil dari Makkah. Pada bulan Ramadhan di sana Jibril datang dan berkata, “Bacalah!”, menyampaikan wahyu pertama.",
    d:"Buku menetapkan wahyu pertama turun Senin malam 21 Ramadhan, bertepatan 10 Agustus 610 M, ketika usia beliau 40 tahun lebih 6 bulan 12 hari menurut kalender Hijriyah. Sebelumnya, selama enam bulan, tanda nubuwah datang lewat mimpi yang hakiki. Bab ini juga membahas wahyu yang terputus, turunnya Jibril untuk kedua kalinya, dan pembagian jenis wahyu."},
 k:["Gua Hira","Iqra’","Mimpi hakiki","21 Ramadhan"],
 q:{s:{t:"Di mana wahyu pertama turun?",o:["Gua Hira di Jabal Nur","Gua Tsaur","Bukit Shafa"],a:0,
     e:"Nabi biasa menyendiri di Gua Hira, sekitar dua mil dari Makkah. Di sanalah Jibril datang membawa wahyu pertama.",h:"hlm. 61–63"},
    d:{t:"Sebelum Jibril datang, tanda nubuwah muncul lewat mimpi hakiki selama berapa lama?",o:["Tiga bulan","Enam bulan","Satu tahun","Empat puluh hari"],a:1,
     e:"Selama enam bulan mimpi yang beliau alami menyerupai fajar subuh. Mimpi itu satu dari 46 bagian nubuwah.",h:"hlm. 62"}}},

{t:"Tahapan pertama: dakwah sembunyi-sembunyi",lok:"Makkah",hlm:"73–76",
 r:{s:"Dakwah dimulai diam-diam selama tiga tahun kepada orang terdekat. Yang pertama masuk Islam (As-Sabiqunal Awwalun) antara lain Khadijah, Zaid bin Haritsah, Ali bin Abu Thalib, dan Abu Bakar.",
    d:"Buku menjelaskan alasannya: Makkah adalah pusat agama Arab dan penyembahan berhala, sehingga langkah paling bijaksana adalah tidak mengagetkan mereka. Abu Bakar kemudian mengajak Utsman bin Affan, Az-Zubair, Abdurrahman bin Auf, Sa’d bin Abi Waqqash, dan Thalhah. Bilal dan banyak sahabat lain menyusul."},
 k:["As-Sabiqunal Awwalun","Khadijah","Zaid bin Haritsah","Abu Bakar"],
 q:{s:{t:"Siapa sepupu Nabi yang saat itu masih anak-anak, hidup dalam asuhan beliau, dan termasuk yang pertama masuk Islam?",o:["Ali bin Abu Thalib","Umar bin Al-Khaththab","Hamzah bin Abdul Muththalib"],a:0,
     e:"Ali bin Abu Thalib termasuk As-Sabiqunal Awwalun, bersama Khadijah, Zaid bin Haritsah, dan Abu Bakar. Mereka masuk Islam pada hari pertama dimulainya dakwah.",h:"hlm. 73–74"},
    d:{t:"Menurut buku, mengapa dakwah dimulai secara sembunyi-sembunyi?",o:["Karena belum ada perintah berdakwah kepada keluarga","Karena Makkah pusat agama dan berhala Arab, sehingga paling bijaksana tidak mengagetkan mereka","Karena Abu Thalib melarang dakwah","Karena belum ada seorang pun yang masuk Islam"],a:1,
     e:"Buku menyebut Makkah sebagai sentral agama bangsa Arab. Memperbaiki keadaan mereka sulit, sehingga langkah paling bijaksana adalah tidak membuat mereka kaget oleh sesuatu yang menggusarkan.",h:"hlm. 73"}}},

{t:"Tahapan kedua: dakwah terang-terangan",lok:"Makkah dan Habasyah",hlm:"77–118",
 r:{s:"Turun ayat, “Berilah peringatan kepada kerabatmu yang dekat.” Nabi naik ke bukit Shafa dan memanggil suku-suku Quraisy. Tekanan makin berat, sehingga kaum Muslimin berkumpul di rumah Al-Arqam dan sebagian hijrah ke Habasyah.",
    d:"Ayat Asy-Syu’ara: 214 membuka tahap ini. Tekanan terhadap yang lemah dimulai sekitar tahun keempat nubuwah; rumah Al-Arqam bin Abil-Arqam di atas bukit Shafa menjadi markas sejak tahun kelima. Hamzah masuk Islam di akhir tahun keenam, dan Umar tiga hari setelahnya."},
 k:["Asy-Syu’ara: 214","Bukit Shafa","Darul-Arqam","Hijrah ke Habasyah","Hamzah dan Umar"],
 q:{s:{t:"Siapa yang masuk Islam tiga hari setelah Hamzah bin Abdul Muththalib?",o:["Utsman bin Affan","Umar bin Al-Khaththab","Abu Ubaidah bin Al-Jarrah"],a:1,
     e:"Hamzah masuk Islam di akhir tahun keenam nubuwah. Umar masuk Islam pada Dzul Hijjah tahun yang sama, tiga hari setelahnya. Sebelumnya Nabi berdoa agar Islam dikokohkan dengan salah satu dari Umar atau Abu Jahal.",h:"hlm. 108–109"},
    d:{t:"Mengapa Habasyah menjadi tujuan hijrah kaum Muslimin yang tertekan?",o:["Karena penduduk Habasyah sudah memeluk Islam","Karena Habasyah berada di bawah kekuasaan Quraisy","Karena rajanya, Najasyi, dikenal adil sehingga tidak ada yang teraniaya di sisinya"],a:2,
     e:"Rasulullah mengetahui bahwa Ashhamah An-Najasyi adalah raja yang adil. Hijrah ini menyusul turunnya surah Al-Kahfi dan Az-Zumar yang mengisyaratkan hijrah dan luasnya bumi Allah.",h:"hlm. 97–98"}}},

{t:"Pemboikotan dan Tahun Berduka",lok:"Perkampungan Abu Thalib",hlm:"119–140",
 r:{s:"Quraisy memboikot Bani Hasyim dan Bani Al-Muththalib selama tiga tahun. Setelah itu Abu Thalib wafat pada tahun kesepuluh nubuwah, disusul Khadijah. Masa ini disebut Tahun Berduka.",
    d:"Piagam boikot dibuat di perkampungan Bani Kinanah. Isinya melarang menikah, berjual beli, berteman, berkumpul, memasuki rumah, dan berbicara dengan mereka, kecuali jika Muhammad diserahkan untuk dibunuh. Buku juga merinci enam faktor yang menguatkan kesabaran, mulai dari iman kepada Allah sampai kabar gembira tentang datangnya keberhasilan."},
 k:["Piagam boikot","Pembatalan piagam","Wafatnya Abu Thalib","Wafatnya Khadijah"],
 q:{s:{t:"Berapa lama Bani Hasyim dan Bani Al-Muththalib diboikot Quraisy?",o:["Satu tahun","Sepuluh tahun","Tiga tahun"],a:2,
     e:"Pemboikotan berlangsung ketat selama tiga tahun. Persediaan makanan habis sampai mereka memakan dedaunan dan kulit binatang.",h:"hlm. 119–120"},
    d:{t:"Kapan Abu Thalib wafat menurut buku?",o:["Ramadhan tahun kelima nubuwah","Rajab tahun kesepuluh nubuwah, enam bulan setelah pemboikotan berakhir","Syawwal tahun kesepuluh nubuwah, sepulang dari Thaif"],a:1,
     e:"Buku menyebut Rajab tahun kesepuluh, enam bulan setelah keluar dari pemboikotan. Ada pula pendapat Ramadhan, tiga bulan sebelum Khadijah wafat.",h:"hlm. 127"}}},

{t:"Tahapan ketiga: Thaif dan Isra’ Mi’raj",lok:"Thaif dan Makkah",hlm:"141–164",
 r:{s:"Pada Syawwal tahun kesepuluh nubuwah, Nabi berjalan kaki ke Thaif bersama Zaid bin Haritsah, tetapi para pemimpin Bani Tsaqif menolak. Setelah itu terjadi Isra’ dan Mi’raj, dan shalat lima waktu diwajibkan.",
    d:"Nabi berada di Thaif sepuluh hari dan menawarkan Islam kepada tiga bersaudara pemimpin Tsaqif. Buku mendaftar beberapa pendapat tentang waktu Isra’ dan menolak tiga yang pertama. Alasannya, Khadijah wafat pada Ramadhan tahun kesepuluh, sebelum shalat lima waktu diwajibkan."},
 k:["Thaif","Bani Tsaqif","Isra’ dan Mi’raj","Shalat lima waktu"],
 q:{s:{t:"Siapa yang menemani Nabi berjalan kaki ke Thaif?",o:["Abu Bakar","Zaid bin Haritsah","Ali bin Abu Thalib"],a:1,
     e:"Nabi ke Thaif pada Syawwal tahun kesepuluh nubuwah, sekitar 60 mil dari Makkah, berjalan kaki pergi dan pulang bersama pembantunya, Zaid bin Haritsah.",h:"hlm. 141"},
    d:{t:"Mengapa buku menolak tiga pendapat pertama tentang waktu Isra’?",o:["Karena Isra’ terjadi sebelum wahyu pertama","Karena Khadijah wafat Ramadhan tahun kesepuluh, saat shalat lima waktu belum diwajibkan, padahal kewajiban itu turun pada malam Isra’","Karena Isra’ pasti terjadi setelah hijrah"],a:1,
     e:"Tidak ada perbedaan pendapat bahwa shalat lima waktu diwajibkan pada malam Isra’. Karena Khadijah wafat sebelum kewajiban itu ada, Isra’ tidak mungkin terjadi pada waktu-waktu yang terlalu awal.",h:"hlm. 158"}}},

{t:"Baiat Aqabah",lok:"Aqabah, Mina",hlm:"155–176",
 r:{s:"Pada musim haji tahun kesebelas nubuwah, enam orang Yastrib masuk Islam. Tahun berikutnya dua belas orang datang untuk Baiat Aqabah pertama. Pada Baiat Aqabah kedua hadir 73 laki-laki dan 2 wanita, dan Nabi meminta ditunjuk dua belas pemuka.",
    d:"Lima dari dua belas orang pada baiat pertama adalah bagian dari enam orang sebelumnya. Utusan Islam di Madinah, As’ad bin Zurarah bersama Mush’ab bin Umair, berhasil luar biasa. Pada baiat kedua, klausulnya meliputi taat, berinfak, amar ma’ruf nahi mungkar, berjuang tanpa takut celaan, dan melindungi Nabi."},
 k:["Enam orang Yastrib","Aqabah pertama","Aqabah kedua","Dua belas pemuka"],
 q:{s:{t:"Setelah Baiat Aqabah kedua, berapa orang pemuka yang diminta Nabi untuk ditunjuk?",o:["Tujuh","Dua belas","Tujuh puluh tiga"],a:1,
     e:"Nabi meminta ditunjuk dua belas pemuka, masing-masing bertanggung jawab atas kaumnya.",h:"hlm. 173"},
    d:{t:"Manakah klausul terakhir Baiat Aqabah kedua?",o:["Menyerahkan seluruh harta kepada Nabi","Memerangi semua kabilah Arab terlebih dahulu","Melindungi Nabi sebagaimana mereka melindungi diri, istri, dan anak-anak mereka"],a:2,
     e:"Klausulnya menolong dan melindungi Nabi bila beliau datang, dan bagi mereka surga. Baiat dilakukan dengan berjabat tangan; terhadap dua wanita yang hadir, Nabi membaiat hanya dengan perkataan.",h:"hlm. 172–173"}}},

{t:"Hijrah ke Madinah",lok:"Makkah, Gua Tsaur, Quba’",hlm:"177–199",
 r:{s:"Setelah Aqabah kedua, kaum Muslimin hijrah ke Madinah. Quraisy bermusyawarah di Darun Nadwah dan mengepung rumah Nabi, sementara Ali tidur di tempat tidur beliau. Nabi dan Abu Bakar bersembunyi di Gua Tsaur, lalu tiba di Quba’.",
    d:"Mereka menempuh jalur ke selatan, arah Yaman, sekitar 5 mil sampai Gunung Tsaur. Suraqah bin Malik sempat membuntuti perjalanan itu. Nabi tiba di Quba’ pada Senin 8 Rabiul Awwal tahun ke-14 nubuwah atau tahun pertama hijrah (23 September 622 M), tinggal empat hari, membangun Masjid Quba’, lalu berangkat pada hari Jumat."},
 k:["Darun Nadwah","Gua Tsaur","Suraqah bin Malik","Quba’"],
 q:{s:{t:"Siapa yang tidur di tempat tidur Nabi saat rumah beliau dikepung?",o:["Abu Bakar","Zaid bin Haritsah","Ali bin Abu Thalib"],a:2,
     e:"Nabi berkata kepada Ali, “Tidurlah di atas tempat tidurku, berselimutlah dengan mantelku.” Ali tetap aman dari gangguan mereka.",h:"hlm. 187"},
    d:{t:"Di Quba’, apa yang Nabi dirikan dan berapa lama beliau tinggal?",o:["Masjid Nabawi, tujuh hari","Masjid Quba’, empat hari","Masjid Quba’, sebulan"],a:1,
     e:"Beliau tinggal empat hari, Senin sampai Kamis, dan membangun Masjid Quba’, masjid pertama yang didirikan atas dasar takwa setelah nubuwah.",h:"hlm. 198"}}},

{t:"Membangun masyarakat Madinah",lok:"Madinah",hlm:"200–219",
 r:{s:"Di Madinah Nabi membangun Masjid Nabawi dan mempersaudarakan Muhajirin dengan Anshar, 90 orang seluruhnya. Nabi juga membuat perjanjian dengan pihak Yahudi.",
    d:"Buku lebih dulu menggambarkan Madinah yang masih labil saat hijrah, dengan tiga kelompok. Lalu pembangunan masjid dan kisah mimpi adzan, persaudaraan Muhajirin dan Anshar yang dikutip dari Ibnul Qayyim, butir-butir perjanjian Islam, pengaruh spiritual dalam masyarakat, dan perjanjian dengan pihak Yahudi."},
 k:["Masjid Nabawi","Muhajirin dan Anshar","Persaudaraan","Perjanjian dengan Yahudi"],
 q:{s:{t:"Berapa orang yang dipersaudarakan Nabi antara Muhajirin dan Anshar?",o:["Sembilan puluh","Dua belas","Tiga ratus tiga belas"],a:0,
     e:"Menurut Ibnul Qayyim yang dikutip buku, ada sembilan puluh orang, separuh dari Muhajirin dan separuh lagi dari Anshar.",h:"hlm. 211"},
    d:{t:"Di rumah siapa Nabi mempersaudarakan Muhajirin dan Anshar, menurut kutipan Ibnul Qayyim?",o:["Rumah Abu Ayyub","Rumah Anas bin Malik","Rumah Abu Bakar"],a:1,
     e:"Ibnul Qayyim menuturkan hal itu terjadi di rumah Anas bin Malik, dan yang dipersaudarakan sembilan puluh orang.",h:"hlm. 211"}}},

{t:"Perang Badr Kubra",lok:"Badr",hlm:"233–271",
 r:{s:"Perang Badr Kubra terjadi pada Ramadhan 2 H. Pasukan Islam berjumlah sekitar 313 orang menghadapi pasukan Quraisy dari Makkah. Setelah pertempuran ada masalah tawanan, dan Nabi menasihati agar mereka diperlakukan dengan baik.",
    d:"Rincian pasukan Islam: 313 sampai 317 orang, terdiri dari 82–86 Muhajirin, 61 Aus, dan 170 Khazraj. Buku membahas majelis permusyawaratan, kegiatan mata-mata untuk memperoleh data akurat tentang pasukan Makkah, serta perdebatan masalah tawanan. Abu Bakar mengusulkan tebusan agar kedudukan kaum Muslimin kuat."},
 k:["Ramadhan 2 H","313 pasukan","Musyawarah","Tawanan"],
 q:{s:{t:"Bagaimana Nabi menasihati para sahabat memperlakukan tawanan Badr?",o:["Mengusir mereka dari Madinah","Menahan mereka tanpa makanan","Memperlakukan mereka dengan baik"],a:2,
     e:"Tawanan dibagikan kepada para sahabat dengan nasihat agar diperlakukan baik. Para sahabat makan korma, sedangkan tawanan disuguhi roti.",h:"hlm. 267"},
    d:{t:"Menurut rincian buku, kelompok mana yang paling banyak di pasukan Islam pada Badr?",o:["Muhajirin","Aus","Khazraj"],a:2,
     e:"Buku merinci 82–86 dari Muhajirin, 61 dari Aus, dan 170 dari Khazraj.",h:"hlm. 234"}}},

{t:"Perang Uhud",lok:"Uhud",hlm:"291–342",
 r:{s:"Quraisy datang membalas dengan sedikitnya tiga ribu prajurit. Abdullah bin Ubay dan pengikutnya mundur, sehingga pasukan Islam tinggal 700 orang. Nabi menempatkan pemanah di bukit, tetapi sebagian besar dari mereka meninggalkan pos karena tergoda harta rampasan.",
    d:"Quraisy tiba pada Jumat 6 Syawwal 3 H. Pemanah ditempatkan di bukit selatan Wadi Qanat yang kemudian dikenal sebagai Jabal Rumat, sekitar 150 meter dari pasukan Muslimin. Buku menyebut kesalahan fatal para pemanah, Khalid bin Al-Walid memutar jalan, lalu Hamzah gugur. Rangkaian ini ditutup Perang Hamra’ul-Asad."},
 k:["3 H","Abdullah bin Ubay","Jabal Rumat","Khalid bin Al-Walid","Hamzah"],
 q:{s:{t:"Setelah Abdullah bin Ubay dan pengikutnya mundur, berapa prajurit Islam yang melanjutkan ke Uhud?",o:["313","700","Tiga ribu"],a:1,
     e:"Nabi melanjutkan perjalanan bersama sisa pasukan yang terdiri dari 700 prajurit.",h:"hlm. 299"},
    d:{t:"Ketika pemanah tergoda harta rampasan, siapa yang tetap di pos?",o:["Seluruh pemanah tetap bertahan","Hanya Abdullah bin Jubair seorang diri","Abdullah bin Jubair dan sembilan rekannya"],a:2,
     e:"Abdullah bin Jubair mengingatkan perintah Nabi, tetapi mayoritas tidak peduli. Empat puluh orang meninggalkan pos, tinggal Ibnu Jubair dan sembilan rekannya. Kesempatan itu dipakai Khalid bin Al-Walid untuk memutar ke belakang pasukan.",h:"hlm. 310"}}},

{t:"Perang Ahzab dan Bani Quraizhah",lok:"Madinah",hlm:"357–379",
 r:{s:"Sepuluh ribu prajurit musuh berkumpul di sekitar Madinah. Atas usul Salman Al-Farisi, kaum Muslimin menggali parit. Setelah itu terjadi pengepungan Bani Quraizhah.",
    d:"Pasukan musuh lebih banyak daripada seluruh penduduk Madinah, termasuk wanita, anak-anak, dan orang tua. Salman mengusulkan parit berdasarkan kebiasaan orang Persia yang dikepung musuh. Peperangan Bani Quraizhah terjadi pada Dzul Qa’dah 5 H dengan pengepungan selama dua puluh lima hari."},
 k:["Khandaq","Salman Al-Farisi","10.000 prajurit","Bani Quraizhah"],
 q:{s:{t:"Siapa yang mengusulkan penggalian parit saat Madinah dikepung?",o:["Salman Al-Farisi","Khalid bin Al-Walid","Abdullah bin Ubay"],a:0,
     e:"Salman berkata bahwa orang-orang Persia membuat parit di sekitar mereka bila dikepung musuh. Usulan itu disepakati majelis.",h:"hlm. 358"},
    d:{t:"Berapa lama pengepungan Bani Quraizhah berlangsung?",o:["Tiga hari","Dua puluh lima hari","Tiga bulan"],a:1,
     e:"Perang ini terjadi pada Dzul Qa’dah 5 H, dan pengepungan berjalan dua puluh lima hari.",h:"hlm. 378"}}},

{t:"Perjanjian Hudaibiyah",lok:"Hudaibiyah",hlm:"400–417",
 r:{s:"Pada 1 Dzul Qa’dah 6 H sekitar 1.400 sahabat berangkat ke Makkah tanpa senjata selain pedang bersarung. Quraisy berusaha menghalangi, lalu dibuat perjanjian dengan gencatan senjata sepuluh tahun.",
    d:"Utsman bin Affan diutus ke Quraisy dan ditahan cukup lama. Isu terbunuhnya Utsman memicu Baiat Ridhwan di bawah pohon. Buku lalu membahas klausul-klausul perjanjian, kasus Abu Jandal, dialog Umar dengan Rasulullah, dan hikmah yang bisa dipetik dari klausul-klausulnya."},
 k:["6 H","Baiat Ridhwan","Gencatan 10 tahun","Abu Jandal"],
 q:{s:{t:"Berapa lama gencatan senjata dalam Perjanjian Hudaibiyah?",o:["Sepuluh tahun","Satu tahun","Tiga tahun"],a:0,
     e:"Salah satu klausulnya: gencatan senjata di antara kedua pihak selama sepuluh tahun, agar semua merasa aman dan tidak saling memerangi.",h:"hlm. 408"},
    d:{t:"Apa yang memicu Baiat Ridhwan?",o:["Kekalahan di Uhud","Isu terbunuhnya Utsman bin Affan di Makkah","Kedatangan utusan Najasyi"],a:1,
     e:"Quraisy menahan Utsman cukup lama dan tersebar isu ia dibunuh. Para sahabat berbaiat di bawah pohon, dan Allah menurunkan ayat yang menyatakan ridha-Nya kepada mereka.",h:"hlm. 406–407"}}},

{t:"Babak baru: surat kepada raja dan Perang Khaibar",lok:"Madinah dan Khaibar",hlm:"418–464",
 r:{s:"Setelah Hudaibiyah, Nabi mengirim surat kepada raja dan amir, antara lain Najasyi dari Habasyah, Muqauqis dari Mesir, Kisra dari Persia, dan Qaishar dari Romawi. Lalu terjadi Perang Khaibar dengan 1.400 pasukan.",
    d:"Buku mencatat delapan surat, termasuk kepada Al-Mundzir bin Sawa, pemimpin Yamamah, pemimpin Damaskus, dan raja Uman. Penulis juga menetapkan Perang Dzatur Riqa’ pada 7 H, berbeda dari mayoritas penulis yang menempatkannya pada 4 H, karena Abu Musa Al-Asy’ari dan Abu Hurairah ikut serta dan keduanya masuk Islam setelah Khaibar."},
 k:["Delapan surat","Najasyi","Kisra","Khaibar","Dzatur Riqa’"],
 q:{s:{t:"Surat Nabi kepada Kisra ditujukan kepada raja mana?",o:["Raja Mesir","Raja Persia","Raja Romawi"],a:1,
     e:"Daftar surat dalam buku: Najasyi (Habasyah), Muqauqis (Mesir), Kisra (Persia), Qaishar (Romawi), lalu Al-Mundzir bin Sawa, pemimpin Yamamah, pemimpin Damaskus, dan raja Uman.",h:"hlm. 420–432"},
    d:{t:"Mengapa penulis menempatkan Perang Dzatur Riqa’ pada 7 H, bukan 4 H seperti mayoritas penulis?",o:["Karena Abu Musa Al-Asy’ari dan Abu Hurairah ikut serta, dan keikutsertaan mereka menunjukkan perang itu terjadi setelah Perang Khaibar (7 H)","Karena perang itu terjadi tepat sebelum Badr","Karena pasukan Romawi sudah tiba di Madinah"],a:0,
     e:"Itu contoh sikap penulis yang keluar dari perbedaan pendapat dan menetapkan satu pilihan. Dalam pengantar penerjemah dicontohkan pula Perang Bani Mushthaliq, yang ditetapkan Sya’ban 6 H.",h:"Pengantar penerjemah, hlm. xi; bab di hlm. 460"}}},

{t:"Perang Mu’tah dan penaklukan Makkah",lok:"Mu’tah dan Makkah",hlm:"469–503",
 r:{s:"Pada Ramadhan 8 H Nabi berangkat ke Makkah bersama 10.000 sahabat. Beliau membersihkan Ka’bah dari berhala dan menyatakan kepada kaum Quraisy bahwa mereka bebas.",
    d:"Sebabnya, Bani Bakr yang bersekutu dengan Quraisy menyerang mendadak Khuza’ah yang bersekutu dengan Nabi di mata air Al-Watir. Dalam pidatonya Nabi mengutip ucapan Yusuf kepada saudara-saudaranya, “Pada hari ini tidak ada cercaan terhadap kalian.” Kunci Ka’bah diserahkan kembali kepada Utsman bin Thalhah. Perang Mu’tah mendahului peristiwa ini."},
 k:["Ramadhan 8 H","Khuza’ah","Bani Bakr","Utsman bin Thalhah"],
 q:{s:{t:"Berapa sahabat yang menyertai Nabi dalam penaklukan Makkah?",o:["1.400","12.000","10.000"],a:2,
     e:"Sepuluh hari lewat Ramadhan 8 H, Nabi meninggalkan Madinah menuju Makkah bersama 10.000 sahabat.",h:"hlm. 484"},
    d:{t:"Peristiwa apa yang menjadi latar penaklukan Makkah?",o:["Bani Bakr menyerang Khuza’ah, sekutu Nabi, padahal sudah ada Hudaibiyah","Quraisy membakar Masjid Nabawi","Abu Sufyan menolak berunding sama sekali"],a:0,
     e:"Setelah Hudaibiyah, Khuza’ah bergabung ke pihak Nabi dan Bani Bakr ke pihak Quraisy. Bani Bakr memanfaatkan rasa aman itu untuk menyerang Khuza’ah di mata air Al-Watir.",h:"hlm. 478"}}},

{t:"Perang Hunain dan Perang Tabuk",lok:"Hunain dan Tabuk",hlm:"505–538",
 r:{s:"Pada Syawwal 8 H, 12.000 orang berangkat ke Hunain: 10.000 dari penaklukan Makkah ditambah penduduk Makkah yang baru masuk Islam. Kemudian pasukan sebanyak 30.000 prajurit berangkat ke Tabuk.",
    d:"Pada Tabuk, banyaknya pasukan membuat persiapan bekal tidak sempurna meski banyak sedekah. Orang munafik mangkir dengan alasan dusta, sedangkan tiga orang Mukmin yang lurus mangkir tanpa alasan yang dibenarkan, lalu diuji Allah dan kesalahan mereka diampuni."},
 k:["Hunain","Hawazin","Tabuk","Tiga yang mangkir"],
 q:{s:{t:"Berapa jumlah pasukan Islam yang berangkat ke Tabuk?",o:["3.000","10.000","30.000"],a:2,
     e:"Karena jumlahnya yang sangat besar, 30.000 prajurit, persiapan bekal tidak sempurna meski banyak harta disedekahkan.",h:"hlm. 531"},
    d:{t:"Apa yang terjadi pada tiga orang Mukmin yang mangkir dari Tabuk tanpa alasan yang dibenarkan?",o:["Mereka diusir dari Madinah","Mereka diuji Allah, kemudian kesalahan mereka diampuni","Mereka dianggap munafik selamanya"],a:1,
     e:"Buku membedakan mereka dari orang munafik. Ketiganya orang Mukmin yang lurus, diuji Allah, lalu diampuni.",h:"hlm. 535"}}},

{t:"Haji Wada’ dan wafatnya Nabi",lok:"Makkah dan Madinah",hlm:"561–577",
 r:{s:"Pada 10 H Nabi menunaikan Haji Wada’. Di sana turun ayat tentang disempurnakannya agama (Al-Maidah: 3). Nabi wafat pada Senin 12 Rabiul Awwal 11 H, dalam usia 63 tahun lebih empat hari.",
    d:"Saat mengutus Mu’adz bin Jabal ke Yaman pada 10 H, Nabi bersabda bahwa boleh jadi Mu’adz tidak akan bertemu beliau lagi sesudah tahun itu. Beliau memasuki Makkah pada Senin 4 Dzul Hijjah 10 H setelah perjalanan delapan hari. Buku kemudian menguraikan tanda-tanda perpisahan sampai detik-detik terakhir dan sikap Umar serta Abu Bakar."},
 k:["Haji Wada’","Al-Maidah: 3","Mu’adz bin Jabal","12 Rabiul Awwal 11 H"],
 q:{s:{t:"Pada usia berapa Nabi wafat menurut buku?",o:["60 tahun lebih","63 tahun lebih empat hari","65 tahun"],a:1,
     e:"Beliau wafat pada Senin 12 Rabiul Awwal 11 H, saat waktu dhuha sudah terasa panas, dalam usia 63 tahun lebih empat hari.",h:"hlm. 574"},
    d:{t:"Kapan Nabi memasuki Makkah saat Haji Wada’?",o:["Senin 4 Dzul Hijjah 10 H","Jumat 9 Dzul Hijjah 9 H","Kamis 1 Muharram 11 H"],a:0,
     e:"Beliau memasuki Makkah setelah shalat subuh dan mandi pagi pada Senin 4 Dzul Hijjah 10 H. Perjalanan ditempuh delapan hari.",h:"hlm. 562"}}}
];

var X=[{"s": [{"t": "Siapa yang membawa berhala Hubal dari Syam dan meletakkannya di dalam Ka’bah?", "o": ["Abrahah", "Amr bin Luhay, pemimpin Bani Khuza’ah", "Qushay bin Kilab"], "a": 1, "e": "Amr bin Luhay melihat penduduk Syam menyembah berhala dan menganggapnya baik. Sepulang dari sana ia membawa Hubal ke Ka’bah dan mengajak penduduk Makkah menyekutukan Allah.", "h": "hlm. 23"}, {"t": "Berapa jumlah berhala di sekitar Ka’bah ketika Nabi menaklukkan Makkah?", "o": ["1.000", "30", "360"], "a": 2, "e": "Buku menyebut ada 360 berhala di sekitar Ka’bah. Rasulullah menghancurkannya, lalu memerintahkan agar berhala itu dikeluarkan dari masjid dan dibakar.", "h": "hlm. 24"}], "d": [{"t": "Menurut buku, bagaimana Abrahah menjadi penguasa Yaman?", "o": ["Ia dilantik langsung oleh Kisra Persia", "Ia menaklukkan Najran lebih dulu lalu memproklamasikan diri", "Ia dipilih para pemuka Himyar setelah Dzu Nuwas wafat", "Ia membunuh Aryath, komandan pasukan Habasyah, lalu menggantikannya setelah meminta restu raja Habasyah"], "a": 3, "e": "Sebanyak 70.000 pasukan Habasyah menguasai Yaman untuk kedua kalinya di bawah Aryath pada 525 M. Aryath dibunuh anak buahnya, Abrahah, yang lalu menggantikannya.", "h": "hlm. 12"}, {"t": "Siapa yang dijadikan hakim perdamaian antara Qushay dan Bani Khuza’ah, dan apa putusannya?", "o": ["Ya’mar bin Auf dari Bani Bakr; Qushay lebih layak mengurus Ka’bah dan berkuasa di Makkah", "Amr bin Luhay; urusan Ka’bah dibagi dua", "Hulail bin Hubsyah; kekuasaan tetap di tangan Khuza’ah", "Abdul Muththalib; Ka’bah diurus bergantian tiap tahun"], "a": 0, "e": "Setelah perang dahsyat kedua pihak sepakat berdamai. Ya’mar bin Auf menetapkan bahwa Qushay lebih layak menangani urusan Ka’bah dan berkuasa di Makkah daripada Bani Khuza’ah.", "h": "hlm. 18"}]}, {"s": [{"t": "Setelah ibundanya, siapa wanita pertama yang menyusui Nabi?", "o": ["Tsuwaibah, hamba sahaya Abu Lahab", "Khadijah binti Khuwailid", "Halimah dari Bani Sa’d"], "a": 0, "e": "Tsuwaibah menyusui beliau, setelah sebelumnya menyusui Hamzah. Sesudah itu beliau tinggal di tengah Bani Sa’d, mengikuti tradisi Arab menyusukan bayi di pedesaan.", "h": "hlm. 49"}, {"t": "Pada usia berapa Nabi berdagang ke Syam membawa barang dagangan Khadijah?", "o": ["25 tahun", "12 tahun", "40 tahun"], "a": 0, "e": "Pada usia 25 tahun beliau menjalankan dagangan Khadijah ke Syam. Perjalanan ke Syam pada usia 12 tahun adalah bersama Abu Thalib, tempat beliau bertemu rahib Bahira di Bushra.", "h": "hlm. 54, 56"}], "d": [{"t": "Menurut buku, apa yang menimpa Abrahah setelah pasukannya dibinasakan di sekitar Makkah?", "o": ["Ia melarikan diri ke Habasyah dan hidup di sana", "Ia dibunuh pasukan Quraisy di Wadi Muhassir", "Ia sakit, sendi tulangnya lepas satu per satu, dan ia mati setibanya di Shan’a", "Ia ditawan Bani Khuza’ah lalu dibebaskan"], "a": 2, "e": "Allah mengirim penyakit kepadanya hingga sendi-sendinya lepas. Setibanya di Shan’a dadanya terbelah dan ia mati. Peristiwa ini terjadi pada Muharram, 50 atau 55 hari sebelum kelahiran Nabi.", "h": "hlm. 45"}, {"t": "Nabi bersabda, “Aku adalah anak dua orang yang disembelih.” Siapa dua orang itu?", "o": ["Isma’il dan Ishaq", "Ibrahim dan Isma’il", "Isma’il dan Abdullah", "Abdullah dan Abdul Muththalib"], "a": 2, "e": "Abdul Muththalib bernazar akan mengorbankan salah seorang dari sepuluh putranya jika Allah memberinya anak sebanyak itu. Undian jatuh pada Abdullah, lalu ia ditebus dengan seratus ekor unta.", "h": "hlm. 44, 47"}]}, {"s": [{"t": "Setelah menerima wahyu pertama, kepada siapa Nabi pulang dan meminta, “Selimutilah aku”?", "o": ["Abu Thalib", "Khadijah binti Khuwailid", "Abu Bakar"], "a": 1, "e": "Beliau pulang dengan hati bergetar menemui Khadijah dan minta diselimuti sampai tubuhnya berhenti menggigil.", "h": "hlm. 64"}, {"t": "Apa yang dibawa Nabi sebagai bekal saat menyendiri di Gua Hira?", "o": ["Daging kering dan anggur", "Korma dan susu", "Roti dari gandum dan air"], "a": 2, "e": "Menjelang usia 40 tahun beliau gemar menyendiri. Beliau membawa roti gandum dan air ke Gua Hira di Jabal Nur, sekitar dua mil dari Makkah.", "h": "hlm. 61"}], "d": [{"t": "Wahyu yang datang menyerupai bunyi gemerincing lonceng digambarkan sebagai tingkatan wahyu yang…", "o": ["Paling ringan; hanya berupa bisikan dalam hati", "Paling berat; dahi beliau berkeringat meski cuaca sangat dingin dan hewan tunggangannya menderum", "Disampaikan Jibril dalam rupa manusia di hadapan para sahabat", "Hanya turun lewat mimpi saat tidur"], "a": 1, "e": "Dalam tingkatan ini malaikat tidak terlihat oleh Nabi. Dahi beliau berkerut dan berkeringat sekalipun pada waktu yang sangat dingin, dan hewan tunggangan beliau menderum ke tanah.", "h": "hlm. 68"}, {"t": "Setelah menenangkan Nabi dengan menyebut sifat-sifat beliau, Khadijah membawa beliau menemui siapa?", "o": ["Waraqah bin Naufal, anak paman Khadijah yang beragama Nashrani", "Umayyah bin Ash-Shallat", "Abu Thalib bin Abdul Muththalib", "Bahira, rahib di Bushra"], "a": 0, "e": "Khadijah berkata Allah tidak akan menghinakan beliau karena beliau menyambung silaturahim, memikul beban orang lain, memberi makan orang miskin, menjamu tamu, dan menolong yang menegakkan kebenaran. Waraqah lalu menyatakan beliau benar-benar nabi umat ini.", "h": "hlm. 64–66"}]}, {"s": [{"t": "Berapa lama dakwah secara sembunyi-sembunyi berlangsung?", "o": ["Tiga tahun", "Satu tahun", "Sepuluh tahun"], "a": 0, "e": "Buku menyebut tiga tahun dakwah sembunyi-sembunyi, dimulai kepada orang-orang terdekat.", "h": "hlm. 73"}, {"t": "Pada awal Islam, shalat yang diwajibkan dikerjakan bagaimana, menurut Muqatil bin Sulaiman?", "o": ["Lima waktu seperti sekarang", "Tiga rakaat setiap malam", "Dua rakaat pada pagi hari dan dua rakaat pada petang hari"], "a": 2, "e": "Perintah shalat termasuk wahyu yang pertama turun. Pada awal Islam shalat dikerjakan dua rakaat pagi dan dua rakaat petang.", "h": "hlm. 75"}], "d": [{"t": "Mengapa Quraisy pada awalnya tidak begitu peduli terhadap dakwah Nabi?", "o": ["Karena Abu Jahal sudah menjamin dakwah itu tidak berbahaya", "Mereka mengira beliau hanya salah satu dari orang yang gemar membicarakan ketuhanan, seperti Umayyah bin Ash-Shallat, Qus bin Sa’idah, dan Amr bin Nufail", "Karena dakwah itu hanya disampaikan di luar Makkah", "Karena beliau sudah dilindungi pasukan dari Yastrib"], "a": 1, "e": "Kabar dakwah memang menyebar di kalangan Quraisy, tetapi mereka menganggapnya urusan agama biasa, sampai dakwah mulai menyentuh berhala dan kepemimpinan mereka.", "h": "hlm. 76"}, {"t": "Mengapa seruan Abu Bakar didengar orang-orang Quraisy yang biasa duduk bersamanya?", "o": ["Ia berpengetahuan, sukses berdagang, ramah, dan baik pergaulannya", "Ia memegang kunci Ka’bah", "Ia pemuka Bani Hasyim yang paling kaya", "Ia pemimpin pasukan Quraisy"], "a": 0, "e": "Abu Bakar lemah lembut, pengasih, dan berakhlak mulia. Berkat seruannya masuk Islam Utsman bin Affan, Az-Zubair, Abdurrahman bin Auf, Sa’d bin Abi Waqqash, dan Thalhah bin Ubaidillah.", "h": "hlm. 74"}]}, {"s": [{"t": "Rasulullah menjuluki Umar bin Al-Khaththab setelah ia masuk Islam. Apa julukannya?", "o": ["Al-Faruq", "Ash-Shiddiq", "Saifullah"], "a": 0, "e": "“Al-Faruq” berarti yang memisahkan antara yang haq dan yang batil. Ibnu Mas’ud berkata, hampir-hampir kaum Muslimin tidak bisa shalat di dekat Ka’bah sebelum Umar masuk Islam.", "h": "hlm. 115"}, {"t": "Siapa yang membeli Bilal bin Rabbah dari penyiksanya lalu memerdekakannya?", "o": ["Abu Bakar", "Utsman bin Affan", "Ali bin Abu Thalib"], "a": 0, "e": "Para budak yang masuk Islam disiksa dengan keras. Abu Bakar membeli Bilal, lalu memerdekakannya.", "h": "hlm. 95"}], "d": [{"t": "Siapa utusan Quraisy kepada Najasyi, dan apa yang mereka bawa?", "o": ["Abu Jahal dan Utbah bin Rabi’ah, dengan surat dari Abu Thalib", "Abu Sufyan dan Al-Walid bin Al-Mughirah, dengan uang tebusan", "Umar bin Al-Khaththab dan Khalid bin Al-Walid, dengan pasukan kecil", "Amr bin Al-Ash dan Abdullah bin Abu Rabi’ah, dengan berbagai hadiah untuk Najasyi dan para uskup"], "a": 3, "e": "Quraisy memilih dua orang terpandang dan cerdik yang saat itu belum masuk Islam. Mereka lebih dulu menemui para uskup dengan hadiah, lalu menghadap Najasyi.", "h": "hlm. 101"}, {"t": "Apa tawaran kompromi Al-Aswad, Al-Walid bin Al-Mughirah, dan Al-Ash bin Wa’il kepada Nabi ketika beliau thawaf?", "o": ["Saling menyembah: mereka menyembah apa yang beliau sembah, dan beliau menyembah apa yang mereka sembah", "Beliau diberi harta dan istri tercantik di Makkah", "Beliau diangkat menjadi raja Makkah dengan syarat berhenti berdakwah", "Quraisy menyembah Allah setahun, lalu beliau menyembah berhala setahun"], "a": 0, "e": "Mereka menawarkan persekutuan dalam peribadatan. Tawaran harta dan kedudukan datang dari tokoh lain, Utbah bin Rabi’ah, pada kesempatan terpisah.", "h": "hlm. 88, 116"}]}, {"s": [{"t": "Apa yang ditemukan pada piagam pemboikotan sebelum dirobek?", "o": ["Piagam itu terbakar hangus", "Rayap telah memakan isinya, kecuali tulisan yang memuat nama Allah", "Piagam itu hilang tak berbekas"], "a": 1, "e": "Al-Muth’im bangkit hendak merobek piagam dan mendapati isinya dimakan rayap, kecuali penggalan “Bismika Allahumma” dan bagian yang memuat kata “Allah”. Boikot pun dibatalkan.", "h": "hlm. 123"}, {"t": "Siapa yang diam-diam membawa makanan kepada Bani Hasyim pada malam hari selama pemboikotan?", "o": ["Abu Jahal", "Abu Lahab", "Hisyam bin Amr dari Bani Amir bin Luway"], "a": 2, "e": "Hisyam biasa menemui Bani Hasyim malam hari membawa makanan. Ia lalu menggerakkan beberapa tokoh Quraisy, termasuk Zuhair bin Abu Umayyah, untuk membatalkan piagam.", "h": "hlm. 121–122"}], "d": [{"t": "Apa yang Nabi sabdakan tentang gangguan Quraisy setelah Abu Thalib wafat?", "o": ["Gangguan terberat terjadi saat pemboikotan, bukan sesudahnya", "Beliau tidak mengalami gangguan yang paling beliau benci dari Quraisy sampai Abu Thalib meninggal", "Gangguan Quraisy berkurang karena orang yang mereka segani telah tiada", "Beliau memutuskan segera hijrah ke Habasyah"], "a": 1, "e": "Karena penderitaan yang bertumpuk pada tahun itu, beliau menyebutnya ‘Amul-huzni (tahun duka cita).", "h": "hlm. 130"}, {"t": "Kapan Nabi menikahi Saudah?", "o": ["Rajab tahun ke-3 nubuwah", "Muharram tahun 1 H", "Syawwal tahun ke-10 nubuwah", "Dzul-Qa’dah tahun ke-13 nubuwah"], "a": 2, "e": "Pernikahan itu terjadi sesudah wafatnya Abu Thalib dan Khadijah, pada Syawwal tahun kesepuluh dari nubuwah.", "h": "hlm. 130"}]}, {"s": [{"t": "Di Qarnuts-Tsa’alib, malaikat penjaga gunung menawarkan meratakan Akhsyabain. Apa jawaban Nabi?", "o": ["Beliau menyetujui tawaran itu", "Beliau meminta mereka dihukum dengan banjir", "Beliau berharap dari kalangan mereka lahir orang yang menyembah Allah semata"], "a": 2, "e": "Setelah ditolak di Thaif beliau pergi dengan muka muram. Allah mengutus malaikat penjaga gunung, tetapi beliau memilih berharap kepada keturunan mereka kelak.", "h": "hlm. 144"}, {"t": "Dalam Isra’ Mi’raj Nabi ditawari susu dan khamr. Mana yang beliau pilih?", "o": ["Susu", "Air Zamzam", "Khamr"], "a": 0, "e": "Beliau ditawari susu dan khamr, lalu memilih susu.", "h": "hlm. 161"}], "d": [{"t": "Siapa yang memberi jaminan perlindungan kepada Nabi ketika kembali ke Makkah dari Thaif?", "o": ["Al-Muth’im bin Adi, yang bersiaga dengan anak-anaknya hingga beliau masuk rumah", "Abu Sufyan bin Harb", "Abu Jahal bin Hisyam", "Abu Lahab"], "a": 0, "e": "Abu Jahal hanya menyatakan akan melindungi siapa pun yang dilindungi Muth’im. Rasulullah terus mengenang jasa ini. Pada tawanan Badr beliau bersabda andai Muth’im masih hidup dan memintanya, beliau akan menyerahkan urusan mereka kepadanya.", "h": "hlm. 147"}, {"t": "Setelah shalat diwajibkan lima puluh kali, siapa yang menyarankan Nabi kembali memohon keringanan?", "o": ["Ibrahim", "Isa", "Musa", "Jibril"], "a": 2, "e": "Musa berkata umat beliau tidak akan sanggup, lalu menyuruh beliau kembali kepada Rabb-nya untuk meminta keringanan.", "h": "hlm. 160"}]}, {"s": [{"t": "Siapa duta Islam pertama yang diutus Nabi ke Yastrib setelah Baiat Aqabah pertama?", "o": ["Abu Bakar Ash-Shiddiq", "Ali bin Abu Thalib", "Mush’ab bin Umair"], "a": 2, "e": "Mush’ab, pemuda yang termasuk pendahulu masuk Islam, diutus mengajarkan syariat dan berdakwah. Ia menginap di rumah As’ad bin Zurarah.", "h": "hlm. 166"}, {"t": "Berapa orang yang hadir pada Baiat Aqabah kedua?", "o": ["70 laki-laki dan 5 wanita", "73 laki-laki dan 2 wanita", "12 laki-laki"], "a": 1, "e": "Mereka keluar diam-diam dari rombongan setelah lewat sepertiga malam dan berkumpul di bukit Aqabah. Dua wanita itu Nasibah binti Ka’b (Ummu Ammarah) dan Asma binti Amr (Ummu Mani’).", "h": "hlm. 171"}], "d": [{"t": "Seluruh perkampungan Bani Abdil-Asyhal masuk Islam dalam sehari kecuali satu orang yang menangguhkan keislamannya hingga Perang Uhud. Siapa dia?", "o": ["Usaid bin Hudhair", "As’ad bin Zurarah", "Al-Ushairim", "Abdullah bin Ubay"], "a": 2, "e": "Al-Ushairim masuk Islam saat Perang Uhud, ikut berperang, dan gugur sebagai syahid sebelum pernah shalat. Nabi bersabda, “Dia mengerjakan yang sedikit namun mendapat pahala yang melimpah.”", "h": "hlm. 168–169"}, {"t": "Mengapa Al-Muth’im bin Adi dan Al-Harits bin Harb membebaskan Sa’d bin Ubadah dari siksaan Quraisy?", "o": ["Sa’d masuk Islam di depan mereka", "Abu Jahal memerintahkan pembebasannya", "Sa’d membayar tebusan kepada mereka", "Sa’d pernah menjamin keamanan kafilah dagang mereka saat melewati Madinah"], "a": 3, "e": "Quraisy menangkap Sa’d, mengikat tangan dan lehernya, lalu menyeretnya ke Makkah. Dua orang itu membalas jasa lama Sa’d.", "h": "hlm. 176"}]}, {"s": [{"t": "Apa yang terjadi pada Abu Bakar di Gua Tsaur ketika Nabi tidur di pangkuannya?", "o": ["Ia keluar gua mencari makanan", "Ia disengat hewan, tetapi menahan sakit agar Nabi tidak terbangun", "Ia ketiduran dan lupa berjaga"], "a": 1, "e": "Abu Bakar tidak berani bergerak karena takut mengganggu tidur Rasulullah. Air matanya menetes ke wajah beliau.", "h": "hlm. 189"}, {"t": "Hadiah apa yang dijanjikan Quraisy bagi siapa pun yang membawa Nabi, hidup atau mati?", "o": ["Seribu dinar emas", "Seratus ekor unta", "Sebidang kebun korma"], "a": 1, "e": "Quraisy menempatkan penjaga bersenjata di setiap jalur Makkah dan menyebar para pencari jejak, tetapi tidak menemukan beliau.", "h": "hlm. 190"}], "d": [{"t": "Berapa tokoh Quraisy yang ditunjuk untuk mengepung rumah Nabi pada malam hijrah?", "o": ["Dua puluh orang", "Sebelas orang, antara lain Abu Jahal, Abu Lahab, dan Umayyah bin Khalaf", "Tujuh orang", "Empat puluh orang"], "a": 1, "e": "Parlemen Makkah di Darun Nadwah menyetujui rencana jahat itu dengan suara bulat. Yang tampak tidur di tempat tidur beliau ternyata Ali.", "h": "hlm. 184–188"}, {"t": "Siapa Abdullah bin Uraiqith dalam perjalanan hijrah?", "o": ["Pembantu Abu Bakar yang sudah masuk Islam", "Sahabat Anshar utusan As’ad bin Zurarah", "Pemimpin Bani Khuza’ah", "Penunjuk jalan upahan yang saat itu masih musyrik tetapi dipercaya"], "a": 3, "e": "Nabi dan Abu Bakar mengupahnya dan menyerahkan dua ekor unta kepadanya. Ia datang ke gua pada malam Senin, 16 September 622 M, lalu menempuh jalur pesisir yang jarang dilalui.", "h": "hlm. 190–191"}]}, {"s": [{"t": "Apa langkah pertama yang dilakukan Rasulullah setelah menetap di Madinah?", "o": ["Membangun benteng", "Mengirim pasukan ke Makkah", "Membangun masjid"], "a": 2, "e": "Tempat unta beliau berhenti dibeli dari dua anak yatim, lalu dibangun masjid. Beliau ikut memindahkan bata dan batu.", "h": "hlm. 210"}, {"t": "Sa’d bin Ar-Rabi’ menawarkan separuh hartanya kepada Abdurrahman bin Auf. Apa jawaban Abdurrahman?", "o": ["Ia meminta pulang ke Makkah", "Ia meminta ditunjukkan pasar untuk berdagang", "Ia menerima separuh harta itu"], "a": 1, "e": "Abdurrahman mendoakan keberkahan, lalu minta ditunjukkan pasar Bani Qainuqa’. Tak lama kemudian ia sudah memperoleh samin dan keju.", "h": "hlm. 212"}], "d": [{"t": "Apa tujuan mempersaudarakan Muhajirin dan Anshar, menurut buku?", "o": ["Mencairkan fanatisme Jahiliyah agar tidak ada yang dibela kecuali Islam, dan agar keturunan, warna kulit, serta daerah tidak mendominasi", "Membentuk pasukan tetap untuk menyerang Quraisy", "Menyiapkan aturan pajak perdagangan", "Membagi tanah Madinah secara merata"], "a": 0, "e": "Persaudaraan itu dijadikan ikatan nyata yang mempertautkan darah dan harta, bukan sekadar ucapan.", "h": "hlm. 212"}, {"t": "Bagaimana piagam Nabi dengan orang-orang Yahudi mengatur soal agama?", "o": ["Bagi Yahudi agama mereka dan bagi Muslim agama mereka", "Yahudi dilarang berdagang di Madinah", "Yahudi hanya boleh beribadah di rumah", "Yahudi wajib masuk Islam dalam setahun"], "a": 0, "e": "Piagam menjamin kebebasan beragama dan memutar kekayaan. Orang Yahudi menanggung nafkah mereka sendiri, dan Yatsrib dianggap kota suci bagi pihak-pihak perjanjian.", "h": "hlm. 218–219"}]}, {"s": [{"t": "Apa sasaran awal Rasulullah sebelum Perang Badr?", "o": ["Kafilah dagang Quraisy pimpinan Abu Sufyan", "Kota Thaif", "Benteng Yahudi di Khaibar"], "a": 0, "e": "Kafilah membawa 1.000 unta dengan harta bernilai tak kurang dari 5.000 dinar emas, dikawal tak lebih dari 40 orang. Itu dipandang kesempatan emas memukul Quraisy.", "h": "hlm. 233"}, {"t": "Dua pemuda yang membunuh Abu Jahal adalah Mu’adz bin Amr Al-Jamuh dan…", "o": ["Hamzah bin Abdul Muththalib", "Mu’awwidz bin Afra’", "Abdullah bin Mas’ud"], "a": 1, "e": "Rasulullah menyerahkan rampasan Abu Jahal kepada Mu’adz. Abdullah bin Mas’ud kemudian menemukan Abu Jahal yang tinggal bernapas satu-satu.", "h": "hlm. 255–256"}], "d": [{"t": "Apa yang diusulkan Sa’d bin Mu’adz menjelang pertempuran Badr?", "o": ["Membuat tenda komando bagi Rasulullah dengan kendaraan disiapkan di sisinya", "Menunda perang sampai Ramadhan berikutnya", "Menarik pasukan kembali ke Madinah", "Mengirim surat damai kepada Abu Jahal"], "a": 0, "e": "Tenda itu untuk memimpin sekaligus berjaga jika pasukan terdesak. Dengan kendaraan di sisinya, beliau bisa menyusul orang-orang yang tertinggal di belakang.", "h": "hlm. 243"}, {"t": "Siapa lawan tanding dalam tiga duel pembuka Badr?", "o": ["Ali–Utbah, Hamzah–Al-Walid, Ubaidah–Syaibah", "Ubaidah–Al-Walid, Ali–Syaibah, Hamzah–Utbah", "Ubaidah–Utbah, Hamzah–Syaibah, Ali–Al-Walid", "Hamzah–Abu Jahal, Ali–Utbah, Az-Zubair–Syaibah"], "a": 2, "e": "Hamzah dan Ali menyelesaikan lawannya dengan cepat, lalu membantu Ubaidah yang kakinya putus. Ubaidah wafat di Ash-Shafra’ dalam perjalanan pulang.", "h": "hlm. 249"}]}, {"s": [{"t": "Siapa yang membunuh Hamzah, singa Allah, dalam Perang Uhud?", "o": ["Khalid bin Al-Walid", "Abu Sufyan bin Harb", "Wahsy bin Harb"], "a": 2, "e": "Wahsy dulunya budak Jubair bin Muth’im dan menuturkan sendiri bagaimana ia membunuh Hamzah.", "h": "hlm. 307"}, {"t": "Bagian tubuh Nabi apa yang pecah ketika beliau terluka di Uhud?", "o": ["Gigi seri yang dekat dengan gigi taring", "Tulang rusuk", "Tulang lengan"], "a": 0, "e": "Gigi seri beliau pecah dan kepala beliau terluka. Beliau bersabda, bagaimana mungkin suatu kaum beruntung jika melukai wajah Rasul-Nya.", "h": "hlm. 315"}], "d": [{"t": "Ketika tersiar kabar “Muhammad telah terbunuh”, apa kata seorang Anshar kepada pasukan yang meletakkan senjata?", "o": ["Mintalah perlindungan kepada Abdullah bin Ubay", "Berdamailah dengan Abu Sufyan", "Jika Muhammad terbunuh berarti ia sudah sampai ke surga, maka berperanglah atas nama agama kalian", "Mundurlah ke Madinah dan bertahan di benteng"], "a": 2, "e": "Mental pasukan anjlok, dan sebagian bahkan berpikir mencari perlindungan kepada Abdullah bin Ubay. Seruan itu membangkitkan kembali semangat mereka.", "h": "hlm. 312–313"}, {"t": "Abu Dujanah menerima pedang Rasulullah. Tanda apa yang ia kenakan sebelum menerjang barisan musuh?", "o": ["Mengikat sorban merah di kepala, yang disebut orang Anshar “sorban kematian”", "Melepas baju besinya", "Menanggalkan perisainya", "Mengibarkan bendera hijau"], "a": 0, "e": "Az-Zubair yang meminta pedang itu lebih dulu merasa heran mengapa pedang diberikan kepada Abu Dujanah, lalu menguntitnya untuk melihat apa yang ia lakukan.", "h": "hlm. 306"}]}, {"s": [{"t": "Setelah Perang Khandaq, Jibril menyuruh Nabi bangkit menuju siapa?", "o": ["Bani Quraizhah", "Penduduk Khaibar", "Bani Qainuqa’"], "a": 0, "e": "Pada waktu zhuhur, saat beliau mandi di rumah Ummu Salamah, Jibril berkata para malaikat tidak pernah meletakkan senjata dan menyuruh beliau berangkat ke Bani Quraizhah.", "h": "hlm. 372"}, {"t": "Siapa yang diangkat menjadi hakim untuk memutuskan perkara Bani Quraizhah?", "o": ["Abu Bakar", "Sa’d bin Mu’adz", "Ali bin Abu Thalib"], "a": 1, "e": "Sa’d, yang terluka di lengannya sewaktu Perang Ahzab, dipanggil dengan menaiki keledai. Ia akhirnya wafat karena lukanya.", "h": "hlm. 375, 378"}], "d": [{"t": "Manakah yang BUKAN termasuk tiga usulan Ka’b bin Asad kepada Bani Quraizhah saat dikepung?", "o": ["Masuk Islam demi keamanan darah, harta, anak, dan wanita", "Membunuh anak dan istri sendiri lalu berperang sampai menang atau habis", "Meminta bantuan Persia untuk mengusir kaum Muslimin", "Menyerang Rasulullah dan para sahabat pada hari Sabtu"], "a": 2, "e": "Mereka menolak ketiga usulan itu, sehingga tidak ada pilihan selain pasrah pada keputusan Rasulullah.", "h": "hlm. 373"}, {"t": "Apa isyarat yang diberikan Abu Lubabah kepada Bani Quraizhah, dan apa akibatnya?", "o": ["Ia diam, lalu membela mereka di hadapan Rasulullah", "Ia mengangkat tangan, lalu dihukum oleh Sa’d bin Mu’adz", "Ia meletakkan tangan di leher (isyarat hukuman mati), lalu menyesal dan mengikat dirinya di tiang masjid Nabawi", "Ia menggeleng, lalu pergi ke Makkah"], "a": 2, "e": "Ia bersumpah tidak melepas tali itu sampai Rasulullah sendiri yang melepasnya. Beliau bersabda tidak akan melepasnya kecuali jika ia bertobat kepada Allah.", "h": "hlm. 373–374"}]}, {"s": [{"t": "Tak seorang sahabat pun bangkit menyembelih kurban meski diperintah tiga kali. Siapa yang menyarankan Nabi melakukannya lebih dulu?", "o": ["Abu Bakar", "Umar bin Al-Khaththab", "Ummu Salamah"], "a": 2, "e": "Atas saran Ummu Salamah, beliau keluar tanpa berbicara, menyembelih unta kurban, lalu meminta tukang cukur. Melihat itu para sahabat bangkit menyembelih dan bercukur.", "h": "hlm. 410"}, {"t": "Apa jawaban Nabi kepada Abu Jandal yang meminta agar tidak dikembalikan kepada kaum musyrik?", "o": ["Mengajaknya bergabung ke dalam pasukan", "Segera menyerang Suhail", "Bersabarlah, Allah akan memberi jalan keluar, dan perjanjian tidak akan dilanggar"], "a": 2, "e": "Abu Jandal bin Suhail datang tertatih dengan kaki terbelenggu, tetapi Suhail menyeretnya untuk dikembalikan sesuai perjanjian. Umar menyemangatinya agar bersabar.", "h": "hlm. 409"}], "d": [{"t": "Dalam perjanjian itu, kabilah mana yang bergabung ke pihak Nabi dan mana ke pihak Quraisy?", "o": ["Khuza’ah ke pihak Quraisy; Bani Bakr ke pihak Nabi", "Keduanya memilih netral", "Khuza’ah ke pihak Nabi; Bani Bakr ke pihak Quraisy", "Keduanya ke pihak Nabi"], "a": 2, "e": "Khuza’ah adalah sekutu Bani Hasyim sejak zaman Abdul Muththalib. Kelak Bani Bakr menyerang Khuza’ah, dan hal itu menjadi pemicu penaklukan Makkah.", "h": "hlm. 409, 478"}, {"t": "Setelah turun ayat tentang wanita mukminah yang berhijrah (Al-Mumtahanah), apa yang dilakukan Umar bin Al-Khaththab?", "o": ["Menunda keputusan sampai umrah tahun berikutnya", "Menebus wanita-wanita itu dengan sepuluh ekor unta", "Mengembalikan wanita-wanita itu kepada suami mereka di Makkah", "Menceraikan dua istrinya yang masih kafir"], "a": 3, "e": "Dengan hukum ayat itu orang-orang Muslim menceraikan istri mereka yang kafir. Dua istri Umar kemudian dinikahi Mu’awiyah dan Shafwan bin Umayyah.", "h": "hlm. 411–412"}]}, {"s": [{"t": "Apa cetakan pada cincin stempel perak yang dibuat Nabi untuk menyegel surat kepada para raja?", "o": ["Muhammad Rasul Allah", "Allahu Akbar", "Bismillahirrahmanirrahim"], "a": 0, "e": "Ada yang memberitahu bahwa para raja tidak akan menerima surat tanpa stempel. Surat-surat itu ditulis pada akhir tahun 6 H, sepulang dari Hudaibiyah.", "h": "hlm. 420"}, {"t": "Khaibar terletak sekitar berapa mil dari Madinah dan ke arah mana?", "o": ["Sekitar 6 mil ke arah selatan", "Sekitar 60–80 mil ke arah utara", "Sekitar 300 mil ke arah timur"], "a": 1, "e": "Khaibar adalah kota besar dengan benteng dan kebun-kebun. Rasulullah menyerangnya sesudah gencatan senjata Hudaibiyah.", "h": "hlm. 440"}], "d": [{"t": "Apa yang dilakukan Zainab binti Al-Harits setelah Khaibar ditaklukkan?", "o": ["Masuk Islam di hadapan Nabi", "Menyembunyikan harta Bani Nadhir", "Menyerahkan kunci benteng Al-Qamush", "Menyodorkan daging domba panggang yang disusupi racun kepada Nabi"], "a": 3, "e": "Zainab, istri Sallam bin Misykam, mendatangi beliau sesudah beliau merasa tenang karena Khaibar telah dikuasai.", "h": "hlm. 456"}, {"t": "Bagaimana tanah Khaibar dibagi?", "o": ["Seluruhnya dibagikan sama rata kepada prajurit", "Dibagi 10 kelompok masing-masing 50 bagian", "Seluruhnya diserahkan kepada Bani Nadhir", "Dibagi 30 kelompok × 100 bagian (3.600); separuhnya untuk Nabi dan kaum Muslimin, separuh lagi untuk para wakil beliau dan urusan umum"], "a": 3, "e": "Abdullah bin Rawahah menyusun perkiraan bagi hasilnya. Peserta Hudaibiyah (1.400 orang) juga mendapat bagian dari separuh yang terakhir.", "h": "hlm. 454"}]}, {"s": [{"t": "Berapa kekuatan pasukan Muslimin di Mu’tah dan musuhnya?", "o": ["3.000 prajurit melawan sekitar 200.000", "10.000 prajurit melawan 20.000", "300 prajurit melawan 1.000"], "a": 0, "e": "Pasukan Muslimin menghadapi Romawi dan sekutu Arab mereka, dan hanya dua belas orang yang gugur. Perang ini terjadi pada Jumadil Ula 8 H.", "h": "hlm. 469, 472, 475"}, {"t": "Ja’far bin Abu Thalib dijuluki At-Thayyar. Apa artinya?", "o": ["Singa padang pasir", "Penerbang, atau “yang memiliki dua sayap”", "Pembawa panji"], "a": 1, "e": "Ja’far gugur setelah kedua tangannya putus sambil mempertahankan bendera. Dikatakan Allah menganugerahinya dua sayap di surga. Ibnu Umar menghitung puluhan luka di tubuh depannya.", "h": "hlm. 472–473"}], "d": [{"t": "Ketika Abu Sufyan datang ke Madinah untuk memperbarui perjanjian, apa yang dilakukan putrinya, Ummu Habibah?", "o": ["Memberinya hadiah untuk dibawa ke Makkah", "Mengusirnya dari Madinah", "Melipat lapik Rasulullah agar tidak diduduki ayahnya yang musyrik", "Menolak membukakan pintu rumah"], "a": 2, "e": "Ummu Habibah berkata, lapik itu milik Rasulullah, sedangkan ayahnya musyrik lagi najis.", "h": "hlm. 481"}, {"t": "Di mana surat Hathib bin Abu Balta’ah kepada Quraisy ditemukan?", "o": ["Di dalam sepatu seorang lelaki", "Disembunyikan di gelungan rambut seorang wanita pembawanya", "Di rumah Abu Sufyan", "Di dalam pelana seekor unta"], "a": 1, "e": "Surat itu membocorkan niat keberangkatan Rasulullah. Setelah didesak Ali dan rekannya, wanita itu melepas gelungan rambutnya dan mengeluarkan surat tersebut.", "h": "hlm. 484"}]}, {"s": [{"t": "Saat pasukan tercerai-berai di Hunain, siapa yang berseru, “Manakah orang yang berikrar di bawah pohon?”", "o": ["Al-Abbas bin Abdul Muththalib", "Abu Bakar", "Umar bin Al-Khaththab"], "a": 0, "e": "Al-Abbas memiliki suara paling lantang. Para sahabat menyahut, “Kami mendengar seruanmu,” dan kembali berkumpul.", "h": "hlm. 509"}, {"t": "Dalam pembagian harta rampasan Hunain di Ji’ranah, berapa bagian setiap prajurit yang tidak berkuda?", "o": ["4 ekor unta dan 40 domba", "1 ekor unta dan 10 domba", "40 ekor unta dan 4 domba"], "a": 0, "e": "Penunggang kuda mendapat 12 ekor unta dan 120 domba.", "h": "hlm. 514"}], "d": [{"t": "Mengapa Nabi menunda pembagian rampasan Hunain selama sekitar 10 hari di Ji’ranah?", "o": ["Karena rampasan belum selesai dihitung", "Menunggu hasil pengepungan Thaif", "Menunggu wahyu tentang pembagiannya", "Menunggu utusan Hawazin yang mungkin datang memohon amnesti dan mengambil kembali harta mereka"], "a": 3, "e": "Karena tidak ada yang datang, beliau mulai membagi, antara lain untuk melunakkan hati para pemimpin kabilah dan pemuka Makkah yang baru masuk Islam.", "h": "hlm. 513–514"}, {"t": "Berapa orang utusan Hawazin yang datang dan siapa pemimpinnya?", "o": ["30 orang, dipimpin Malik bin Auf", "14 orang, dipimpin Zuhair bin Shurad", "7 orang, dipimpin Duraid", "100 orang, dipimpin Abu Burqan"], "a": 1, "e": "Mereka datang setelah semua rampasan dibagi untuk masuk Islam dan memohon dikembalikannya tawanan serta harta. Di antara mereka ada paman sepersusuan beliau, Abu Burqan.", "h": "hlm. 516"}]}, {"s": [{"t": "Siapa yang menjadi imam shalat menggantikan Nabi selama beliau sakit?", "o": ["Ali bin Abu Thalib", "Umar bin Al-Khaththab", "Abu Bakar Ash-Shiddiq"], "a": 2, "e": "Setelah tiga kali pingsan saat hendak menuju masjid, beliau mengutus orang memanggil Abu Bakar untuk mengimami. Sejak hari itu Abu Bakar yang mengimami.", "h": "hlm. 572"}, {"t": "Di mana Nabi dimakamkan?", "o": ["Di kaki bukit Uhud", "Di tempat beliau wafat, di bilik Aisyah", "Di pekuburan Baqi’"], "a": 1, "e": "Abu Bakar meriwayatkan sabda beliau bahwa seorang nabi dikuburkan di tempat ia wafat. Abu Thalhah menggali liang lahat tepat di bawah tempat tidur beliau.", "h": "hlm. 574, 577"}], "d": [{"t": "Apa yang Nabi tetapkan tentang riba dalam khutbah Haji Wada’?", "o": ["Riba Jahiliyah tidak berlaku, dan riba pertama yang dihapus adalah riba Al-Abbas bin Abdul Muththalib", "Riba dihapus kecuali bagi kalangan Quraisy", "Riba tetap boleh asal tidak berlipat ganda", "Riba pertama yang dihapus adalah riba Abu Sufyan"], "a": 0, "e": "Beliau juga menghapus darah Jahiliyah; darah pertama yang dihapus adalah darah Ibnu Rabi’ah bin Al-Harits.", "h": "hlm. 563"}, {"t": "Mengapa Umar menangis ketika turun ayat, “Pada hari ini telah Kusempurnakan untuk kamu agamamu”?", "o": ["Karena setelah kesempurnaan itu hanya ada kekurangan", "Karena kecewa dengan pembagian harta", "Karena takut pada pasukan Romawi", "Karena kalah dalam perdebatan"], "a": 0, "e": "Ayat Al-Maidah: 3 turun pada Haji Wada’. Umar tak kuasa menahan air matanya.", "h": "hlm. 564"}]}];

/* ---------- Tantangan acak + lencana ---------- */
var CHN=10,ch={on:false,qs:[],n:0,score:0,streak:0,maxStreak:0,pick:-1,log:[],fin:false};
function chPool(){
  var pool=[];
  for(var i=0;i<S.length;i++){
    if(!(st.learn||isDone(i)))continue;
    QS(i).forEach(function(q){pool.push({i:i,q:q});});
  }
  return pool;
}
function chStart(){
  var pool=shuffle(chPool()).slice(0,CHN);
  ch={on:true,fin:false,n:0,score:0,streak:0,maxStreak:0,pick:-1,log:[],qs:pool.map(function(p){
    var idx=shuffle(p.q.o.map(function(_,k){return k;}));
    return {i:p.i,t:p.q.t,o:idx.map(function(k){return p.q.o[k];}),a:idx.indexOf(p.q.a),e:p.q.e,h:p.q.h};
  })};
}
function chAnswer(k){
  var q=ch.qs[ch.n];if(ch.pick>-1)return;
  ch.pick=k;
  if(k===q.a){ch.score++;ch.streak++;if(ch.streak>ch.maxStreak)ch.maxStreak=ch.streak;}
  else{ch.streak=0;ch.log.push(q);}
}
function chNext(){
  ch.pick=-1;ch.n++;
  if(ch.n>=ch.qs.length){
    ch.fin=true;var p=P();
    p.chBest=Math.max(p.chBest||0,ch.score);
    if(ch.score===ch.qs.length)p.chPerfect=true;
    save();
  }
}
function badgeList(){
  var p=P(),b=BANDS.map(function(x){
    var ok=true;for(var i=x.from;i<=x.to;i++)if(!isDone(i))ok=false;
    return {t:x.t,ok:ok};
  });
  b.push({t:"Ujian urutan peristiwa",ok:!!p.tl});
  b.push({t:"Tantangan acak sempurna",ok:!!p.chPerfect});
  return b;
}
function badgesHTML(){
  return '<ul class="badges" aria-label="Lencana">'+badgeList().map(function(b){
    return '<li class="'+(b.ok?'on':'off')+'"><span aria-hidden="true">'+(b.ok?'★':'☆')+'</span> '+esc(b.t)+'<span class="sr"> '+(b.ok?'diraih':'belum')+'</span></li>';
  }).join("")+'</ul>';
}
function chHTML(){
  var p=P(),pool=chPool(),h='';
  if(!ch.on){
    var n=Math.min(CHN,pool.length);
    h='<p>Soal acak dari stasiun yang sudah kamu selesaikan (opsi diacak, satu soal satu kali). Cocok buat mengulang sebelum lanjut.</p>';
    if(!pool.length)h+='<p class="fb err">Selesaikan minimal satu stasiun dulu, atau nyalakan Mode belajar.</p>';
    else h+='<p class="muted">'+pool.length+' soal tersedia · tantangan '+n+' soal'+(p.chBest?' · skor terbaik '+p.chBest+'':'')+'</p><button class="btn" data-ch="start">Mulai tantangan</button>';
    return h;
  }
  if(ch.fin){
    h='<div aria-live="polite"><p class="chscore">Skor '+ch.score+' / '+ch.qs.length+' · rentetan benar terpanjang '+ch.maxStreak+'</p></div>';
    if(ch.log.length){
      h+='<p>Perlu diulang (rujuk buku):</p><ul class="chlog">'+ch.log.map(function(q){return '<li><b>'+esc(S[q.i].t)+'</b> · '+esc(q.h)+'<br>'+esc(q.t)+' <i>→ '+esc(q.o[q.a])+'</i></li>';}).join("")+'</ul>';
    }else h+='<p class="fb good">Sempurna. Semua jawaban benar.</p>';
    return h+'<div class="row"><button class="btn" data-ch="start">Main lagi</button><button class="btn ghost" data-ch="close">Tutup</button></div>';
  }
  var q=ch.qs[ch.n],done=ch.pick>-1;
  h='<p class="muted">Soal '+(ch.n+1)+' dari '+ch.qs.length+' · skor '+ch.score+' · rentetan '+ch.streak+'</p>';
  h+='<p class="qt">'+esc(q.t)+'</p><div class="opts">';
  q.o.forEach(function(o,k){
    var cls="opt";if(done){if(k===q.a)cls+=" ok";else if(k===ch.pick)cls+=" bad";}
    h+='<button class="'+cls+'" data-ch="ans" data-k="'+k+'"'+(done?' disabled':'')+'>'+esc(o)+'</button>';
  });
  h+='</div><div aria-live="polite">';
  if(done)h+='<p class="fb '+(ch.pick===q.a?'good':'err')+'">'+(ch.pick===q.a?'Benar. ':'Belum tepat. ')+esc(q.e)+' <span class="ref">'+esc(q.h)+'</span></p>';
  h+='</div>';
  if(done)h+='<button class="btn" data-ch="next" id="chnext">'+(ch.n+1>=ch.qs.length?'Lihat hasil':'Soal berikutnya')+'</button>';
  return h;
}
function chRender(){
  var el=document.getElementById("ch");if(el)el.innerHTML=chHTML();
  var bd=document.getElementById("badges");if(bd)bd.innerHTML=badgesHTML();
}
document.getElementById("ch").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a=b.getAttribute("data-ch");
  if(a==="start")chStart();
  else if(a==="close")ch.on=false;
  else if(a==="ans")chAnswer(parseInt(b.getAttribute("data-k"),10));
  else if(a==="next")chNext();
  chRender();
  var nb=document.getElementById("chnext");if(nb)nb.focus({preventScroll:true});
});

function reduce(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}}
function wpos(k){var n=NODES[k],q=proj("r",n.ll[0],n.ll[1]);return {x:q[0]+n.dx,y:q[1]+n.dy};}
function bez(a,b,sg){
  var dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1,off=Math.max(len*0.2,7)*sg;
  var c={x:(a.x+b.x)/2-dy/len*off,y:(a.y+b.y)/2+dx/len*off};
  return {len:len*1.08,d:"M"+a.x.toFixed(1)+" "+a.y.toFixed(1)+" Q"+c.x.toFixed(1)+" "+c.y.toFixed(1)+" "+b.x.toFixed(1)+" "+b.y.toFixed(1),
    at:function(t){var u=1-t;return {x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};}};
}
function legSign(i){return i%2?1:-1;}
function legCurve(i){return bez(wpos(NODE_OF[i]),wpos(NODE_OF[i+1]),legSign(i));}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function lerp(a,b,t){return a+(b-a)*t;}
function stDone(j){return j===S.length?!!P().tl:isDone(j);}
function stUnlocked(j){return j===S.length?(doneCount()===S.length||st.learn):unlocked(j);}
function fitZ(){return Math.min(BD.cw/BB.w,BD.ch/BB.h)*0.96;}
function focusZ(){return Math.max(fitZ()*1.2,Math.min(BD.cw/110,5.5));}

      '<circle class="pulse" r="17"/><circle class="nr" r="19"/><circle class="np" r="19" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)"/>'+
      '<circle class="nb" r="15"/><text class="nt" y="4"></text><text class="nl" y="36">'+esc(NODES[k].n)+'</text></g>';
  });

var C23=Math.cos(23*Math.PI/180),C27=Math.cos(27*Math.PI/180);

function placeLabels(items,W,H,occ){
  /* items: {x,y,l,dx,dy,an}; hasilkan posisi tanpa tabrakan dengan label lain dan titik */
  var boxes=occ.slice(),out=[];
  items.forEach(function(it){
    var w=tw(it.l),cands=[],an=it.an||"s",dx=an==="m"?0:(it.dx<0?Math.min(it.dx,-10):Math.max(it.dx,10)),dy=it.dy;
    var flip=an==="s"?"e":"s";
    var fl=function(a,d){return a==="s"?d:-Math.abs(d);};
    cands.push([an,dx,dy]);cands.push(["m",0,-12]);cands.push(["m",0,18]);cands.push([flip,-dx,dy]);
    [-14,14,-28,28,-42,42].forEach(function(s){cands.push([an,dx,dy+s]);cands.push([flip,-dx,dy+s]);});
    var best=null;
    for(var c=0;c<cands.length;c++){

      var x=it.x+ddx,y=it.y+ddy;
      var l=a==="s"?x:(a==="m"?x-w/2:x-w),r=a==="s"?x+w:(a==="m"?x+w/2:x);

      if(!hit){best={x:x,y:y,a:a,box:bx};break;}

function routePath(base,r,bp,k,W,H){

function mapSVG(m,W,opt){
