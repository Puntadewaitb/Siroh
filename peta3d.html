<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E5A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="Game belajar Sirah Nabawiyah berbasis buku Ar-Rahiqul Makhtum untuk remaja dan dewasa.">
<title>Peta Sirah 3D</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#ECEFE8; --surface:#F7F9F4; --ink:#14231D; --muted:#52645B; --line:#C8D1C5;
  --green:#0E5A47; --green-soft:#D5E7DD; --ochre:#9A5F10; --ochre-soft:#F2E2C2;
  --ok:#1B6E45; --ok-soft:#D3EBDC; --bad:#A3362A; --bad-soft:#F4D9D4;
  --f-display:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1815; --surface:#16251F; --ink:#E4EDE8; --muted:#9DB1A7; --line:#2C4038;
  --green:#58C3A1; --green-soft:#1B3A31; --ochre:#E2A850; --ochre-soft:#3A2D14;
  --ok:#5FCB92; --ok-soft:#183A29; --bad:#F08A7C; --bad-soft:#40201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#16251F; --ink:#E4EDE8; --muted:#9DB1A7; --line:#2C4038;
  --green:#58C3A1; --green-soft:#1B3A31; --ochre:#E2A850; --ochre-soft:#3A2D14;
  --ok:#5FCB92; --ok-soft:#183A29; --bad:#F08A7C; --bad-soft:#40201C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top h1{font-size:clamp(28px,7vw,38px);line-height:1.1;letter-spacing:.01em}
.src{margin:0;color:var(--muted);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--green);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-weight:500;color:var(--green)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.stats{display:flex;gap:16px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.learn{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.learn input{accent-color:var(--green);width:16px;height:16px}
.band{margin:28px 0 10px;display:flex;align-items:baseline;gap:10px;color:var(--ochre)}
.band h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-body);font-weight:600}
.band::after{content:"";flex:1;border-top:1px dashed var(--line);transform:translateY(-4px)}
.route{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:0}
.route::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;border-left:2px dashed var(--line)}
.st{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px}
.node{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:14px;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.st.cur .node{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.st.done .node{border-color:var(--green);background:var(--green);color:var(--bg)}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.st.cur .card{border-color:var(--ochre)}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px}
.ttl{font-family:var(--f-display);font-size:19px;line-height:1.25}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.st.lock .card{opacity:.6}
.st.lock .head{cursor:not-allowed}
.body{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.body p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:500}
.q{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.q .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.q .qt{font-weight:600;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:0;font-size:14px}
.fb.good{color:var(--ok)}
.fb.err{color:var(--bad)}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{align-self:flex-start;background:var(--green);color:var(--bg);border:0;border-radius:6px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:flex;flex-direction:column;gap:12px}
.pool,.seq{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tl .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seq li button,.pool li button{width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.seq li button{border-color:var(--green);background:var(--green-soft)}
.seq li span.n{font-family:var(--f-mono);margin-right:8px;color:var(--green)}
.end{margin-top:24px;padding:18px;border:1px solid var(--green);border-radius:10px;background:var(--green-soft)}
.end h2{font-size:24px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:420px){.ttl{font-size:17px}.stats{gap:10px}}
:root{--sea:#CBDDDB;--land:#F2EAD3;--coast:#A9B5A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#0F2B2B;--land:#2A2B1E;--coast:#566B5E}}
:root[data-theme="dark"]{--sea:#0F2B2B;--land:#2A2B1E;--coast:#566B5E}
.st.open{grid-template-columns:minmax(0,1fr)}
.st.open .node{display:none}
.stats{flex-wrap:wrap}
.ovbox{margin-top:4px}
.ovbox summary{cursor:pointer;font-weight:600;color:var(--green);padding:6px 0}
.ovbox .map{display:block;max-width:100%;height:auto;margin-inline:auto;border-radius:8px;border:1px solid var(--line)}
.ovleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.ovleg li{display:flex;align-items:center;gap:6px}
.ovleg i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--surface)}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke}
.map .rt{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.map .rt.dash{stroke-dasharray:7 5}
.rt-a{stroke:var(--green)}.rt-b{stroke:var(--ochre)}.rt-c{stroke:var(--bad)}
.ma-a{fill:var(--green)}.ma-b{fill:var(--ochre)}.ma-c{fill:var(--bad)}
.map .pt{fill:var(--ochre);stroke:var(--surface);stroke-width:2}
.map .pt.main{fill:var(--green)}
.map .pt.ov-none{fill:var(--muted)}.map .pt.ov-part{fill:var(--ochre)}.map .pt.ov-all{fill:var(--green)}
.map .lb{font:500 12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-opacity:.9;stroke-width:3.5px;stroke-linejoin:round}
.map .rg{font:italic 12px var(--f-display);letter-spacing:.12em;fill:var(--muted);text-transform:uppercase}
.mapbox{display:flex;flex-direction:column;gap:8px}
.mapbox .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:6px 12px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.fig{margin:0;display:flex;flex-direction:column;gap:8px}
.fig .map{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.mt{font-family:var(--f-display);font-size:17px}
.leg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.leg li{display:flex;align-items:center;gap:8px}
.leg svg{flex:none}
.mn{margin:0;font-size:13px;color:var(--muted)}
.rv{padding-bottom:10px;border-bottom:1px dashed var(--line)}
.rv:last-child{border-bottom:0;padding-bottom:0}
.rv .qt{margin:0 0 4px}
.ans{margin:0 0 4px;font-size:14px;color:var(--ok);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted);font-size:13px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.badges li{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badges li.on{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ink);font-weight:600}
.chbox #ch{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.chbox #ch p{margin:0}
.chscore{font-family:var(--f-display);font-size:20px}
.chlog{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:8px}
/* ---------- Papan peta + panel ---------- */
.game{display:block;margin-top:10px}
.game>main{display:block;margin-top:10px}
.extras{margin-top:18px}
.boardw{position:sticky;top:0;z-index:5;padding-block:6px;background:var(--bg)}
#board{position:relative;height:clamp(210px,34vh,320px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sea)}
#bsv{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#bsv:active{cursor:grabbing}
.bctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.bctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;opacity:.92}
.bctl button:hover{border-color:var(--green)}
.rg.bz{font:italic 600 13px var(--f-display);letter-spacing:.14em;fill:var(--muted);text-anchor:middle;opacity:.85}
.lgc{fill:none;stroke:var(--surface);stroke-width:9;stroke-opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lg{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.45}
.lg.done{stroke:var(--green);stroke-width:4.5;stroke-dasharray:none;opacity:1}
.lg.next{stroke:var(--ochre);stroke-dasharray:3 8;opacity:1;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.nd{cursor:pointer;outline:none}
.nd .nr{fill:var(--surface);stroke:var(--line);stroke-width:3}
.nd .np{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round}
.nd .nb{fill:var(--bg)}
.nd .nt{font:600 11px var(--f-mono);fill:var(--ink);text-anchor:middle}
.nd .nl{font:600 12px var(--f-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.nd.done .nb{fill:var(--green)}.nd.done .nt{fill:var(--bg);font-size:13px}
.nd.cur .nb{fill:var(--ochre-soft)}.nd.cur .nr{stroke:var(--ochre)}.nd.cur .np{stroke:var(--ochre)}
.nd.lock{opacity:.6}
.nd.sel .nr{stroke:var(--green);stroke-width:5}
.nd .pulse{display:none;fill:none}
.nd.cur .pulse{display:block;stroke:var(--ochre);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.nd:focus-visible .nr{stroke:var(--ink);stroke-width:5}
.tk{pointer-events:none}
.tk .pin{fill:var(--ochre);stroke:var(--surface);stroke-width:2}
.tk .pdot{fill:var(--surface)}
.tk .bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pn{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;scroll-margin-top:var(--bh,0px)}
.pn.enter{animation:pnin .5s ease both}
@keyframes pnin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pnh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl{font-family:var(--f-display);font-size:22px}
.pc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stabs{display:flex;flex-wrap:wrap;gap:6px}
.stab{min-height:38px;min-width:46px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:13px}
.stab i{font-style:normal;font-size:12px}
.stab.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.stab.cur{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.stab.lock{opacity:.55}
.stab[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;font-weight:600}
.pt{font-size:20px;line-height:1.25}
.pm{margin:-6px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pn .body{border-top:1px solid var(--line)}
.bnote{margin:0;font-size:12px;color:var(--muted)}
.is-moving{opacity:.45;pointer-events:none;transition:opacity .2s}
@media (min-width:900px){
  .wrap{max-width:1120px}
  .game{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:16px}
  .game>main{margin-top:0}
  .boardw{top:12px;padding-block:0;background:transparent}
  #board{height:clamp(420px,80vh,660px)}
}
@media (prefers-reduced-motion:reduce){.nd.cur .pulse,.tk .bob,.lg.next,.pn.enter{animation:none}}
/* ---------- Hati + tipe soal ---------- */
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hearts{font-size:20px;letter-spacing:3px;color:var(--bad);line-height:1}
.hint{margin:0;font-size:13px;color:var(--muted)}
.opt.pick{border-color:var(--green);background:var(--green-soft)}
.q .btn[disabled]{opacity:.5;cursor:not-allowed}
.mtg{display:flex;flex-direction:column;gap:10px}
.mtr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.mtl{font-weight:500}
.mtr select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.okrow{display:block;padding:9px 12px;border-radius:8px;border:1px solid var(--ok);background:var(--ok-soft)}
.okrow .n{font-family:var(--f-mono);margin-right:8px;color:var(--ok)}
.failbox{border-color:var(--bad)}
.failbox .lbl{color:var(--bad)}
@media (max-width:420px){.mtr{grid-template-columns:1fr}}

/* ---------- Peta 3D (prototipe) ---------- */
.w3{max-width:1180px}
.top3{padding:14px 0 10px}
.top3 h1{margin:0;font-family:var(--f-display);font-size:clamp(1.4rem,4.6vw,2rem);color:var(--green)}
.top3 .src{margin:.2rem 0 0;color:var(--muted);font-size:.86rem}
.top3 a{color:var(--green)}
.m3wrap{position:relative;height:min(64vh,620px);min-height:340px;border-radius:18px;overflow:hidden;background:var(--bg);border:1px solid var(--line);touch-action:none}
.m3wrap::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 36px 14px var(--bg);border-radius:18px}
.m3{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.m3.ready{opacity:1}
.cv3{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.cv3:active{cursor:grabbing}
.ov3{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.l3{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.nd3{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);font:600 .8rem var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.nd3 .c{font:600 .68rem var(--f-mono);background:var(--line);color:var(--ink);border-radius:999px;padding:2px 6px}
.nd3.done .c{background:var(--ok);color:#fff}
.nd3.cur{border-color:var(--ochre);box-shadow:0 0 0 3px color-mix(in srgb,var(--ochre) 35%,transparent),0 2px 8px rgba(0,0,0,.18)}
.nd3.cur .c{background:var(--ochre);color:#fff}
.nd3.sel{outline:2px solid var(--green);outline-offset:2px}
.nd3:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.rg3{font:.72rem var(--f-display);letter-spacing:.28em;color:var(--muted);opacity:.75;text-shadow:0 1px 0 var(--bg)}
.lm3{font:600 .76rem var(--f-body);color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.c3{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.c3 button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.back3{position:absolute;left:10px;top:10px;z-index:3;border:1px solid var(--line);background:var(--surface);color:var(--green);font:600 .85rem var(--f-body);padding:8px 12px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.no3{padding:24px;color:var(--ink)}
.tl3{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.bd3{flex:none;display:flex;flex-direction:column;gap:6px}
.bt3{font:.68rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:2px solid var(--line);padding-top:4px}
.ch3{display:flex;gap:6px}
.sc3{scroll-snap-align:center;width:118px;flex:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.sc3 b{font:600 .72rem var(--f-mono);color:var(--muted)}
.sc3 span{font:600 .78rem/1.25 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sc3 i{font:normal .7rem var(--f-body);color:var(--muted)}
.sc3.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.sc3.done b{color:var(--ok)}
.sc3.cur{border-color:var(--ochre);background:var(--ochre-soft)}
.sc3.sel{outline:2px solid var(--green);outline-offset:1px}
.info3{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:4px}
.info3 h2{margin:.1rem 0 .3rem;font-family:var(--f-display);color:var(--green);font-size:1.3rem}
.k3{margin:0;font:.72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ochre)}
.mut3{color:var(--muted);font-size:.86rem}
.sm3{font-size:.8rem;margin-bottom:0}

{t:"Jazirah Arab sebelum risalah",lok:"Jazirah Arab",hlm:"1–39",
 r:{s:"Sebelum Nabi diutus, bangsa Arab hidup dalam kabilah-kabilah. Ada pemeluk Nashrani dan Majusi di beberapa wilayah, tetapi bangsa Arab pada umumnya menjadi penyembah berhala. Makkah dengan Ka’bah adalah pusat agama mereka.",
    d:"Bab pembuka memetakan posisi dan kabilah Arab, kekuasaan di Yaman, Hirah, Syam, dan Hijaz, lalu agama serta kondisi sosial, ekonomi, dan akhlak jahiliyah. Abrahah membangun gereja “Ka’bah Yaman” agar bangsa Arab berhaji ke sana, dan riwayat Abu Dawud dari Aisyah mencatat empat macam pernikahan jahiliyah."},
 k:["Kabilah Arab","Abrahah","Agama jahiliyah","Pernikahan jahiliyah"],
 q:{s:{t:"Abrahah membangun gereja bernama “Ka’bah Yaman”. Apa tujuannya?",o:["Sebagai tempat ibadah khusus pasukan Habasyah", "Agar bangsa Arab berhaji ke gereja itu", "Untuk menyimpan harta rampasan pasukan Habasyah"],a:1,
     e:"Abrahah menginginkan semua bangsa Arab berhaji ke gereja itu dan hendak menghancurkan Baitullah di Makkah, tetapi Allah membinasakannya.",h:"hlm. 31"},
    d:{t:"Menurut riwayat Abu Dawud dari Aisyah, pernikahan pada masa jahiliyah ada berapa macam?",o:["Dua", "Tiga", "Empat", "Lima"],a:2,
     e:"Buku mencantumkan riwayat itu: empat macam. Yang pertama pernikahan spontan, lamaran kepada wali lalu mas kawin diserahkan seketika.",h:"hlm. 33"}}},

{t:"Kelahiran dan empat puluh tahun sebelum nubuwah",lok:"Makkah dan Syam",hlm:"40–60",
 r:{s:"Nabi lahir di Makkah dari keluarga Bani Hasyim pada Senin pagi, 9 Rabiul Awwal tahun Gajah (571 M). Beliau disusui Halimah dari Bani Sa’d, ikut Abu Thalib berdagang ke Syam pada usia 12 tahun, lalu menikah dengan Khadijah.",
    d:"Bab ini memuat masa di Bani Sa’d, asuhan kakek dan paman, rahib Bahira, Perang Fijar pada usia 15 tahun, dan Hilful-Fudhul. Pada usia 25 tahun beliau berdagang ke Syam membawa dagangan Khadijah bersama Maisarah; Khadijah saat itu berusia 40 tahun. Pada usia 35 tahun beliau menengahi perselisihan peletakan Hajar Aswad."},
 k:["Tahun Gajah","Halimah","Bahira","Hilful-Fudhul","Hajar Aswad"],
 q:{s:{t:"Quraisy berselisih tentang siapa yang berhak meletakkan Hajar Aswad. Bagaimana Nabi menyelesaikannya?",o:["Diundi di antara pemuka kabilah, yang menang meletakkannya", "Diserahkan kepada pemuka kabilah tertua untuk meletakkannya sendiri", "Diletakkan di atas selendang, lalu para pemuka kabilah mengangkatnya bersama"],a:2,
     e:"Nabi meminta selendang, meletakkan Hajar Aswad di tengahnya, lalu meminta pemuka kabilah memegang ujung-ujungnya dan mengangkatnya bersama. Setelah dekat, beliau meletakkannya di tempat semula.",h:"hlm. 58"},
    d:{t:"Apa isi pokok perjanjian Hilful-Fudhul yang dihadiri Nabi?",o:["Pembagian tugas penjagaan Ka’bah antar kabilah", "Larangan berperang di bulan-bulan haram bagi seluruh kabilah Arab", "Kewajiban membayar tebusan darah secara bergilir", "Tak seorang pun dibiarkan teraniaya; yang zalim harus dibalas"],a:3,
     e:"Para kabilah sepakat tak seorang pun, penduduk Makkah atau lainnya, dibiarkan teraniaya. Setelah risalah, Nabi bersabda perjanjian itu lebih disukai daripada keledai yang terbagus.",h:"hlm. 55"}}},

{t:"Gua Hira dan wahyu pertama",lok:"Gua Hira, Jabal Nur",hlm:"61–71",
 r:{s:"Menjelang usia 40 tahun, Nabi suka menyendiri di Gua Hira di Jabal Nur, sekitar dua mil dari Makkah. Pada bulan Ramadhan di sana Jibril datang dan berkata, “Bacalah!”, menyampaikan wahyu pertama.",
    d:"Buku menetapkan wahyu pertama turun Senin malam 21 Ramadhan, bertepatan 10 Agustus 610 M, ketika usia beliau 40 tahun lebih 6 bulan 12 hari menurut kalender Hijriyah. Sebelumnya, selama enam bulan, tanda nubuwah datang lewat mimpi yang hakiki. Bab ini juga membahas wahyu yang terputus, turunnya Jibril untuk kedua kalinya, dan pembagian jenis wahyu."},
 k:["Gua Hira","Iqra’","Mimpi hakiki","21 Ramadhan"],
 q:{s:{t:"Di mana wahyu pertama turun?",o:["Gua Hira di Jabal Nur", "Gua Tsaur di Jabal Tsaur", "Bukit Shafa di Makkah"],a:0,
     e:"Nabi biasa menyendiri di Gua Hira, sekitar dua mil dari Makkah. Di sanalah Jibril datang membawa wahyu pertama.",h:"hlm. 61–63"},
    d:{t:"Sebelum Jibril datang, tanda nubuwah muncul lewat mimpi hakiki selama berapa lama?",o:["Enam bulan", "Tiga bulan", "Satu tahun", "Dua tahun"],a:0,
     e:"Selama enam bulan mimpi yang beliau alami menyerupai fajar subuh. Mimpi itu satu dari 46 bagian nubuwah.",h:"hlm. 62"}}},

{t:"Tahapan pertama: dakwah sembunyi-sembunyi",lok:"Makkah",hlm:"73–76",
 r:{s:"Dakwah dimulai diam-diam selama tiga tahun kepada orang terdekat. Yang pertama masuk Islam (As-Sabiqunal Awwalun) antara lain Khadijah, Zaid bin Haritsah, Ali bin Abu Thalib, dan Abu Bakar.",
    d:"Buku menjelaskan alasannya: Makkah adalah pusat agama Arab dan penyembahan berhala, sehingga langkah paling bijaksana adalah tidak mengagetkan mereka. Abu Bakar kemudian mengajak Utsman bin Affan, Az-Zubair, Abdurrahman bin Auf, Sa’d bin Abi Waqqash, dan Thalhah. Bilal dan banyak sahabat lain menyusul."},
 k:["As-Sabiqunal Awwalun","Khadijah","Zaid bin Haritsah","Abu Bakar"],
 q:{s:{t:"Siapa sepupu Nabi yang saat itu masih anak-anak, hidup dalam asuhan beliau, dan termasuk yang pertama masuk Islam?",o:["Umar bin Al-Khaththab", "Ali bin Abu Thalib", "Hamzah bin Abdul Muththalib"],a:1,
     e:"Ali bin Abu Thalib termasuk As-Sabiqunal Awwalun, bersama Khadijah, Zaid bin Haritsah, dan Abu Bakar. Mereka masuk Islam pada hari pertama dimulainya dakwah.",h:"hlm. 73–74"},
    d:{t:"Menurut buku, mengapa dakwah dimulai secara sembunyi-sembunyi?",o:["Karena belum ada perintah untuk berdakwah kepada keluarga", "Karena Makkah pusat agama Arab, jadi tidak boleh mengagetkan mereka", "Karena Abu Thalib melarang dakwah dilakukan di Makkah", "Karena belum ada satu pun orang yang masuk Islam"],a:1,
     e:"Buku menyebut Makkah sebagai sentral agama bangsa Arab. Memperbaiki keadaan mereka sulit, sehingga langkah paling bijaksana adalah tidak membuat mereka kaget oleh sesuatu yang menggusarkan.",h:"hlm. 73"}}},

{t:"Tahapan kedua: dakwah terang-terangan",lok:"Makkah dan Habasyah",hlm:"77–118",
 r:{s:"Turun ayat, “Berilah peringatan kepada kerabatmu yang dekat.” Nabi naik ke bukit Shafa dan memanggil suku-suku Quraisy. Tekanan makin berat, sehingga kaum Muslimin berkumpul di rumah Al-Arqam dan sebagian hijrah ke Habasyah.",
    d:"Ayat Asy-Syu’ara: 214 membuka tahap ini. Tekanan terhadap yang lemah dimulai sekitar tahun keempat nubuwah; rumah Al-Arqam bin Abil-Arqam di atas bukit Shafa menjadi markas sejak tahun kelima. Hamzah masuk Islam di akhir tahun keenam, dan Umar tiga hari setelahnya."},
 k:["Asy-Syu’ara: 214","Bukit Shafa","Darul-Arqam","Hijrah ke Habasyah","Hamzah dan Umar"],
 q:{s:{t:"Siapa yang masuk Islam tiga hari setelah Hamzah bin Abdul Muththalib?",o:["Utsman bin Affan", "Abu Ubaidah bin Al-Jarrah", "Umar bin Al-Khaththab"],a:2,
     e:"Hamzah masuk Islam di akhir tahun keenam nubuwah. Umar masuk Islam pada Dzul Hijjah tahun yang sama, tiga hari setelahnya. Sebelumnya Nabi berdoa agar Islam dikokohkan dengan salah satu dari Umar atau Abu Jahal.",h:"hlm. 108–109"},
    d:{t:"Mengapa Habasyah menjadi tujuan hijrah kaum Muslimin yang tertekan?",o:["Karena penduduk Habasyah sudah lebih dulu memeluk Islam", "Karena Habasyah berada di bawah perlindungan Quraisy", "Karena rajanya, Najasyi, dikenal adil dan tak ada yang teraniaya", "Karena Najasyi sudah mengirim undangan kepada kaum Muslimin"],a:2,
     e:"Rasulullah mengetahui bahwa Ashhamah An-Najasyi adalah raja yang adil. Hijrah ini menyusul turunnya surah Al-Kahfi dan Az-Zumar yang mengisyaratkan hijrah dan luasnya bumi Allah.",h:"hlm. 97–98"}}},

{t:"Pemboikotan dan Tahun Berduka",lok:"Perkampungan Abu Thalib",hlm:"119–140",
 r:{s:"Quraisy memboikot Bani Hasyim dan Bani Al-Muththalib selama tiga tahun. Setelah itu Abu Thalib wafat pada tahun kesepuluh nubuwah, disusul Khadijah. Masa ini disebut Tahun Berduka.",
    d:"Piagam boikot dibuat di perkampungan Bani Kinanah. Isinya melarang menikah, berjual beli, berteman, berkumpul, memasuki rumah, dan berbicara dengan mereka, kecuali jika Muhammad diserahkan untuk dibunuh. Buku juga merinci enam faktor yang menguatkan kesabaran, mulai dari iman kepada Allah sampai kabar gembira tentang datangnya keberhasilan."},
 k:["Piagam boikot","Pembatalan piagam","Wafatnya Abu Thalib","Wafatnya Khadijah"],
 q:{s:{t:"Berapa lama Bani Hasyim dan Bani Al-Muththalib diboikot Quraisy?",o:["Tiga tahun", "Satu tahun", "Lima tahun"],a:0,
     e:"Pemboikotan berlangsung ketat selama tiga tahun. Persediaan makanan habis sampai mereka memakan dedaunan dan kulit binatang.",h:"hlm. 119–120"},
    d:{t:"Kapan Abu Thalib wafat menurut buku?",o:["Muharram tahun ke-7 nubuwah, di tengah pemboikotan", "Syawwal tahun ke-10 nubuwah, sepulang dari Thaif", "Dzul Hijjah tahun ke-11 nubuwah, menjelang baiat Aqabah", "Rajab tahun ke-10 nubuwah, enam bulan setelah boikot berakhir"],a:3,
     e:"Buku menyebut Rajab tahun kesepuluh, enam bulan setelah keluar dari pemboikotan. Ada pula pendapat Ramadhan, tiga bulan sebelum Khadijah wafat.",h:"hlm. 127"}}},

{t:"Tahapan ketiga: Thaif dan Isra’ Mi’raj",lok:"Thaif dan Makkah",hlm:"141–164",
 r:{s:"Pada Syawwal tahun kesepuluh nubuwah, Nabi berjalan kaki ke Thaif bersama Zaid bin Haritsah, tetapi para pemimpin Bani Tsaqif menolak. Setelah itu terjadi Isra’ dan Mi’raj, dan shalat lima waktu diwajibkan.",
    d:"Nabi berada di Thaif sepuluh hari dan menawarkan Islam kepada tiga bersaudara pemimpin Tsaqif. Buku mendaftar beberapa pendapat tentang waktu Isra’ dan menolak tiga yang pertama. Alasannya, Khadijah wafat pada Ramadhan tahun kesepuluh, sebelum shalat lima waktu diwajibkan."},
 k:["Thaif","Bani Tsaqif","Isra’ dan Mi’raj","Shalat lima waktu"],
 q:{s:{t:"Siapa yang menemani Nabi berjalan kaki ke Thaif?",o:["Abu Bakar Ash-Shiddiq", "Zaid bin Haritsah", "Ali bin Abu Thalib"],a:1,
     e:"Nabi ke Thaif pada Syawwal tahun kesepuluh nubuwah, sekitar 60 mil dari Makkah, berjalan kaki pergi dan pulang bersama pembantunya, Zaid bin Haritsah.",h:"hlm. 141"},
    d:{t:"Mengapa buku menolak tiga pendapat pertama tentang waktu Isra’?",o:["Karena Khadijah wafat sebelum shalat lima waktu diwajibkan", "Karena Isra’ terjadi sebelum turunnya wahyu yang pertama kali", "Karena Isra’ baru mungkin terjadi setelah Baiat Aqabah kedua", "Karena Abu Thalib masih hidup pada waktu yang mereka sebutkan"],a:0,
     e:"Tidak ada perbedaan pendapat bahwa shalat lima waktu diwajibkan pada malam Isra’. Karena Khadijah wafat sebelum kewajiban itu ada, Isra’ tidak mungkin terjadi pada waktu-waktu yang terlalu awal.",h:"hlm. 158"}}},

{t:"Baiat Aqabah",lok:"Aqabah, Mina",hlm:"155–176",
 r:{s:"Pada musim haji tahun kesebelas nubuwah, enam orang Yastrib masuk Islam. Tahun berikutnya dua belas orang datang untuk Baiat Aqabah pertama. Pada Baiat Aqabah kedua hadir 73 laki-laki dan 2 wanita, dan Nabi meminta ditunjuk dua belas pemuka.",
    d:"Lima dari dua belas orang pada baiat pertama adalah bagian dari enam orang sebelumnya. Utusan Islam di Madinah, As’ad bin Zurarah bersama Mush’ab bin Umair, berhasil luar biasa. Pada baiat kedua, klausulnya meliputi taat, berinfak, amar ma’ruf nahi mungkar, berjuang tanpa takut celaan, dan melindungi Nabi."},
 k:["Enam orang Yastrib","Aqabah pertama","Aqabah kedua","Dua belas pemuka"],
 q:{s:{t:"Setelah Baiat Aqabah kedua, berapa orang pemuka yang diminta Nabi untuk ditunjuk?",o:["Dua puluh", "Tujuh puluh", "Dua belas"],a:2,
     e:"Nabi meminta ditunjuk dua belas pemuka, masing-masing bertanggung jawab atas kaumnya.",h:"hlm. 173"},
    d:{t:"Manakah klausul terakhir Baiat Aqabah kedua?",o:["Menyerahkan seperlima harta mereka kepada Nabi setiap tahun", "Melindungi Nabi seperti mereka melindungi diri dan keluarga mereka", "Memerangi seluruh kabilah Arab bersama Nabi sebelum hijrah", "Tidak menerima pendatang Quraisy di Yastrib sampai Nabi tiba"],a:1,
     e:"Klausulnya menolong dan melindungi Nabi bila beliau datang, dan bagi mereka surga. Baiat dilakukan dengan berjabat tangan; terhadap dua wanita yang hadir, Nabi membaiat hanya dengan perkataan.",h:"hlm. 172–173"}}},

{t:"Hijrah ke Madinah",lok:"Makkah, Gua Tsaur, Quba’",hlm:"177–199",
 r:{s:"Setelah Aqabah kedua, kaum Muslimin hijrah ke Madinah. Quraisy bermusyawarah di Darun Nadwah dan mengepung rumah Nabi, sementara Ali tidur di tempat tidur beliau. Nabi dan Abu Bakar bersembunyi di Gua Tsaur, lalu tiba di Quba’.",
    d:"Mereka menempuh jalur ke selatan, arah Yaman, sekitar 5 mil sampai Gunung Tsaur. Suraqah bin Malik sempat membuntuti perjalanan itu. Nabi tiba di Quba’ pada Senin 8 Rabiul Awwal tahun ke-14 nubuwah atau tahun pertama hijrah (23 September 622 M), tinggal empat hari, membangun Masjid Quba’, lalu berangkat pada hari Jumat."},
 k:["Darun Nadwah","Gua Tsaur","Suraqah bin Malik","Quba’"],
 q:{s:{t:"Siapa yang tidur di tempat tidur Nabi saat rumah beliau dikepung?",o:["Ali bin Abu Thalib", "Abu Bakar Ash-Shiddiq", "Zaid bin Haritsah"],a:0,
     e:"Nabi berkata kepada Ali, “Tidurlah di atas tempat tidurku, berselimutlah dengan mantelku.” Ali tetap aman dari gangguan mereka.",h:"hlm. 187"},
    d:{t:"Di Quba’, apa yang Nabi dirikan dan berapa lama beliau tinggal?",o:["Masjid Nabawi, tujuh hari", "Masjid Quba’, empat hari", "Masjid Quba’, sepuluh hari"],a:1,
     e:"Beliau tinggal empat hari, Senin sampai Kamis, dan membangun Masjid Quba’, masjid pertama yang didirikan atas dasar takwa setelah nubuwah.",h:"hlm. 198"}}},

{t:"Membangun masyarakat Madinah",lok:"Madinah",hlm:"200–219",
 r:{s:"Di Madinah Nabi membangun Masjid Nabawi dan mempersaudarakan Muhajirin dengan Anshar, 90 orang seluruhnya. Nabi juga membuat perjanjian dengan pihak Yahudi.",
    d:"Buku lebih dulu menggambarkan Madinah yang masih labil saat hijrah, dengan tiga kelompok. Lalu pembangunan masjid dan kisah mimpi adzan, persaudaraan Muhajirin dan Anshar yang dikutip dari Ibnul Qayyim, butir-butir perjanjian Islam, pengaruh spiritual dalam masyarakat, dan perjanjian dengan pihak Yahudi."},
 k:["Masjid Nabawi","Muhajirin dan Anshar","Persaudaraan","Perjanjian dengan Yahudi"],
 q:{s:{t:"Berapa orang yang dipersaudarakan Nabi antara Muhajirin dan Anshar?",o:["Tujuh puluh", "Sembilan puluh", "Seratus dua puluh"],a:1,
     e:"Menurut Ibnul Qayyim yang dikutip buku, ada sembilan puluh orang, separuh dari Muhajirin dan separuh lagi dari Anshar.",h:"hlm. 211"},
    d:{t:"Di rumah siapa Nabi mempersaudarakan Muhajirin dan Anshar, menurut kutipan Ibnul Qayyim?",o:["Rumah Abu Ayyub Al-Anshari", "Rumah Abu Bakar Ash-Shiddiq", "Rumah Anas bin Malik"],a:2,
     e:"Ibnul Qayyim menuturkan hal itu terjadi di rumah Anas bin Malik, dan yang dipersaudarakan sembilan puluh orang.",h:"hlm. 211"}}},

{t:"Perang Badr Kubra",lok:"Badr",hlm:"233–271",
 r:{s:"Perang Badr Kubra terjadi pada Ramadhan 2 H. Pasukan Islam berjumlah sekitar 313 orang menghadapi pasukan Quraisy dari Makkah. Setelah pertempuran ada masalah tawanan, dan Nabi menasihati agar mereka diperlakukan dengan baik.",
    d:"Rincian pasukan Islam: 313 sampai 317 orang, terdiri dari 82–86 Muhajirin, 61 Aus, dan 170 Khazraj. Buku membahas majelis permusyawaratan, kegiatan mata-mata untuk memperoleh data akurat tentang pasukan Makkah, serta perdebatan masalah tawanan. Abu Bakar mengusulkan tebusan agar kedudukan kaum Muslimin kuat."},
 k:["Ramadhan 2 H","313 pasukan","Musyawarah","Tawanan"],
 q:{s:{t:"Bagaimana Nabi menasihati para sahabat memperlakukan tawanan Badr?",o:["Mengusir mereka keluar dari Madinah", "Membiarkan mereka tanpa makanan", "Memperlakukan mereka dengan baik"],a:2,
     e:"Tawanan dibagikan kepada para sahabat dengan nasihat agar diperlakukan baik. Para sahabat makan korma, sedangkan tawanan disuguhi roti.",h:"hlm. 267"},
    d:{t:"Menurut rincian buku, kelompok mana yang paling banyak di pasukan Islam pada Badr?",o:["Khazraj", "Muhajirin", "Aus"],a:0,
     e:"Buku merinci 82–86 dari Muhajirin, 61 dari Aus, dan 170 dari Khazraj.",h:"hlm. 234"}}},

{t:"Perang Uhud",lok:"Uhud",hlm:"291–342",
 r:{s:"Quraisy datang membalas dengan sedikitnya tiga ribu prajurit. Abdullah bin Ubay dan pengikutnya mundur, sehingga pasukan Islam tinggal 700 orang. Nabi menempatkan pemanah di bukit, tetapi sebagian besar dari mereka meninggalkan pos karena tergoda harta rampasan.",
    d:"Quraisy tiba pada Jumat 6 Syawwal 3 H. Pemanah ditempatkan di bukit selatan Wadi Qanat yang kemudian dikenal sebagai Jabal Rumat, sekitar 150 meter dari pasukan Muslimin. Buku menyebut kesalahan fatal para pemanah, Khalid bin Al-Walid memutar jalan, lalu Hamzah gugur. Rangkaian ini ditutup Perang Hamra’ul-Asad."},
 k:["3 H","Abdullah bin Ubay","Jabal Rumat","Khalid bin Al-Walid","Hamzah"],
 q:{s:{t:"Setelah Abdullah bin Ubay dan pengikutnya mundur, berapa prajurit Islam yang melanjutkan ke Uhud?",o:["700", "1.000", "313"],a:0,
     e:"Nabi melanjutkan perjalanan bersama sisa pasukan yang terdiri dari 700 prajurit.",h:"hlm. 299"},
    d:{t:"Ketika pemanah tergoda harta rampasan, siapa yang tetap di pos?",o:["Seluruh pemanah tetap bertahan di bukit", "Abdullah bin Jubair dan sembilan rekannya", "Hanya Abdullah bin Jubair seorang diri di pos pemanah"],a:1,
     e:"Abdullah bin Jubair mengingatkan perintah Nabi, tetapi mayoritas tidak peduli. Empat puluh orang meninggalkan pos, tinggal Ibnu Jubair dan sembilan rekannya. Kesempatan itu dipakai Khalid bin Al-Walid untuk memutar ke belakang pasukan.",h:"hlm. 310"}}},

{t:"Perang Ahzab dan Bani Quraizhah",lok:"Madinah",hlm:"357–379",
 r:{s:"Sepuluh ribu prajurit musuh berkumpul di sekitar Madinah. Atas usul Salman Al-Farisi, kaum Muslimin menggali parit. Setelah itu terjadi pengepungan Bani Quraizhah.",
    d:"Pasukan musuh lebih banyak daripada seluruh penduduk Madinah, termasuk wanita, anak-anak, dan orang tua. Salman mengusulkan parit berdasarkan kebiasaan orang Persia yang dikepung musuh. Peperangan Bani Quraizhah terjadi pada Dzul Qa’dah 5 H dengan pengepungan selama dua puluh lima hari."},
 k:["Khandaq","Salman Al-Farisi","10.000 prajurit","Bani Quraizhah"],
 q:{s:{t:"Siapa yang mengusulkan penggalian parit saat Madinah dikepung?",o:["Sa’d bin Mu’adz", "Salman Al-Farisi", "Abu Bakar Ash-Shiddiq"],a:1,
     e:"Salman berkata bahwa orang-orang Persia membuat parit di sekitar mereka bila dikepung musuh. Usulan itu disepakati majelis.",h:"hlm. 358"},
    d:{t:"Berapa lama pengepungan Bani Quraizhah berlangsung?",o:["Dua puluh delapan hari", "Empat puluh hari", "Dua puluh lima hari"],a:2,
     e:"Perang ini terjadi pada Dzul Qa’dah 5 H, dan pengepungan berjalan dua puluh lima hari.",h:"hlm. 378"}}},

{t:"Perjanjian Hudaibiyah",lok:"Hudaibiyah",hlm:"400–417",
 r:{s:"Pada 1 Dzul Qa’dah 6 H sekitar 1.400 sahabat berangkat ke Makkah tanpa senjata selain pedang bersarung. Quraisy berusaha menghalangi, lalu dibuat perjanjian dengan gencatan senjata sepuluh tahun.",
    d:"Utsman bin Affan diutus ke Quraisy dan ditahan cukup lama. Isu terbunuhnya Utsman memicu Baiat Ridhwan di bawah pohon. Buku lalu membahas klausul-klausul perjanjian, kasus Abu Jandal, dialog Umar dengan Rasulullah, dan hikmah yang bisa dipetik dari klausul-klausulnya."},
 k:["6 H","Baiat Ridhwan","Gencatan 10 tahun","Abu Jandal"],
 q:{s:{t:"Berapa lama gencatan senjata dalam Perjanjian Hudaibiyah?",o:["Lima tahun", "Dua tahun", "Sepuluh tahun"],a:2,
     e:"Salah satu klausulnya: gencatan senjata di antara kedua pihak selama sepuluh tahun, agar semua merasa aman dan tidak saling memerangi.",h:"hlm. 408"},
    d:{t:"Apa yang memicu Baiat Ridhwan?",o:["Isu terbunuhnya Utsman bin Affan di Makkah", "Kabar Quraisy mengerahkan pasukan ke Hudaibiyah", "Penolakan Quraisy menerima surat Rasulullah"],a:0,
     e:"Quraisy menahan Utsman cukup lama dan tersebar isu ia dibunuh. Para sahabat berbaiat di bawah pohon, dan Allah menurunkan ayat yang menyatakan ridha-Nya kepada mereka.",h:"hlm. 406–407"}}},

{t:"Babak baru: surat kepada raja dan Perang Khaibar",lok:"Madinah dan Khaibar",hlm:"418–464",
 r:{s:"Setelah Hudaibiyah, Nabi mengirim surat kepada raja dan amir, antara lain Najasyi dari Habasyah, Muqauqis dari Mesir, Kisra dari Persia, dan Qaishar dari Romawi. Lalu terjadi Perang Khaibar dengan 1.400 pasukan.",
    d:"Buku mencatat delapan surat, termasuk kepada Al-Mundzir bin Sawa, pemimpin Yamamah, pemimpin Damaskus, dan raja Uman. Penulis juga menetapkan Perang Dzatur Riqa’ pada 7 H, berbeda dari mayoritas penulis yang menempatkannya pada 4 H, karena Abu Musa Al-Asy’ari dan Abu Hurairah ikut serta dan keduanya masuk Islam setelah Khaibar."},
 k:["Delapan surat","Najasyi","Kisra","Khaibar","Dzatur Riqa’"],
 q:{s:{t:"Surat Nabi kepada Kisra ditujukan kepada raja mana?",o:["Raja Persia", "Raja Mesir", "Raja Romawi"],a:0,
     e:"Daftar surat dalam buku: Najasyi (Habasyah), Muqauqis (Mesir), Kisra (Persia), Qaishar (Romawi), lalu Al-Mundzir bin Sawa, pemimpin Yamamah, pemimpin Damaskus, dan raja Uman.",h:"hlm. 420–432"},
    d:{t:"Mengapa penulis menempatkan Perang Dzatur Riqa’ pada 7 H, bukan 4 H seperti mayoritas penulis?",o:["Karena keikutsertaan Abu Musa dan Abu Hurairah menunjukkan waktunya setelah Khaibar", "Karena semua sumber lama sepakat bahwa perang itu terjadi pada Rabiul Awwal tahun pertama", "Karena perang itu dipimpin Khalid bin Al-Walid setelah Mu’tah", "Karena Nabi baru berangkat setelah Perang Hunain selesai"],a:0,
     e:"Itu contoh sikap penulis yang keluar dari perbedaan pendapat dan menetapkan satu pilihan. Dalam pengantar penerjemah dicontohkan pula Perang Bani Mushthaliq, yang ditetapkan Sya’ban 6 H.",h:"Pengantar penerjemah, hlm. xi; bab di hlm. 460"}}},

{t:"Perang Mu’tah dan penaklukan Makkah",lok:"Mu’tah dan Makkah",hlm:"469–503",
 r:{s:"Pada Ramadhan 8 H Nabi berangkat ke Makkah bersama 10.000 sahabat. Beliau membersihkan Ka’bah dari berhala dan menyatakan kepada kaum Quraisy bahwa mereka bebas.",
    d:"Sebabnya, Bani Bakr yang bersekutu dengan Quraisy menyerang mendadak Khuza’ah yang bersekutu dengan Nabi di mata air Al-Watir. Dalam pidatonya Nabi mengutip ucapan Yusuf kepada saudara-saudaranya, “Pada hari ini tidak ada cercaan terhadap kalian.” Kunci Ka’bah diserahkan kembali kepada Utsman bin Thalhah. Perang Mu’tah mendahului peristiwa ini."},
 k:["Ramadhan 8 H","Khuza’ah","Bani Bakr","Utsman bin Thalhah"],
 q:{s:{t:"Berapa sahabat yang menyertai Nabi dalam penaklukan Makkah?",o:["1.400", "10.000", "12.000"],a:1,
     e:"Sepuluh hari lewat Ramadhan 8 H, Nabi meninggalkan Madinah menuju Makkah bersama 10.000 sahabat.",h:"hlm. 484"},
    d:{t:"Peristiwa apa yang menjadi latar penaklukan Makkah?",o:["Quraisy menahan utusan Nabi yang membawa surat ke Makkah", "Abu Sufyan menolak perpanjangan perjanjian dan mengusir utusan Nabi", "Bani Bakr menyerang Khuza’ah, sekutu Nabi, padahal ada Hudaibiyah"],a:2,

  var el=document.getElementById("board");if(!el)return;
  var s='<svg id="bsv" class="map bmap" width="100%" height="100%" role="group" aria-label="Papan peta perjalanan sirah. Ketuk tempat untuk membuka stasiunnya.">';
  s+='<g id="cam"><rect x="-3000" y="-3000" width="8000" height="8000" class="sea"/><use href="#Lr" class="land"/>';
  [["LAUT MERAH",24.0,36.3],["HIJAZ",23.0,41.9],["SYAM",31.3,37.6]].forEach(function(r){
    var q=proj("r",r[1],r[2]);s+='<text class="rg bz" style="transform:translate('+q[0].toFixed(1)+'px,'+q[1].toFixed(1)+'px) scale(calc(var(--iz) * var(--ns,1)))">'+r[0]+'</text>';});
  for(var i=0;i<S.length;i++){
    if(NODE_OF[i]===NODE_OF[i+1])continue;
    var c=legCurve(i);
    s+='<path class="lgc" d="'+c.d+'"/><path class="lg" id="lg-'+i+'" d="'+c.d+'"/>';
  }
  Object.keys(NODES).forEach(function(k){
    var p=wpos(k);
    s+='<g class="nd" id="nd-'+k+'" data-node="'+k+'" role="button" tabindex="0" style="transform:translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px) scale(calc(var(--iz) * var(--ns,1)))">'+
      '<circle class="pulse" r="17"/><circle class="nr" r="19"/><circle class="np" r="19" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)"/>'+
      '<circle class="nb" r="15"/><text class="nt" y="4"></text><text class="nl" y="36">'+esc(NODES[k].n)+'</text></g>';
  });
  s+='<g id="tok" class="tk" style="transform:translate(0px,0px) scale(calc(var(--iz) * var(--ns,1)))"><g class="bob"><path class="pin" d="M0 -20 C-9 -31 -13 -38 -13 -45 a13 13 0 1 1 26 0 C13 -38 9 -31 0 -20z"/><circle class="pdot" cx="0" cy="-45" r="5"/></g></g>';
  s+='</g></svg>';
  s+='<div class="bctl"><button data-bc="me" aria-label="Ke posisiku" title="Ke posisiku">◎</button><button data-bc="zin" aria-label="Perbesar" title="Perbesar">+</button><button data-bc="zout" aria-label="Perkecil" title="Perkecil">−</button><button data-bc="all" aria-label="Lihat semua" title="Lihat semua">▣</button></div>';
  el.innerHTML=s;
  resizeBoard(true);
}
function applyCam(){
  var c=BD.cam,cam=document.getElementById("cam"),sv=document.getElementById("bsv");if(!cam)return;
  cam.setAttribute("transform","translate("+(BD.cw/2-c.x*c.z).toFixed(2)+" "+(BD.ch/2-c.y*c.z).toFixed(2)+") scale("+c.z.toFixed(4)+")");
  sv.style.setProperty("--iz",(1/c.z).toFixed(4));
  sv.style.setProperty("--ns",Math.max(.55,Math.min(1,.45+c.z/focusZ()*.8)).toFixed(3));
}
function setCam(x,y,z){
  var mn=fitZ()*0.9;z=Math.max(mn,Math.min(7,z));
  x=Math.max(BB.x0-60,Math.min(BB.x0+BB.w+60,x));y=Math.max(BB.y0-60,Math.min(BB.y0+BB.h+60,y));
  BD.cam={x:x,y:y,z:z};applyCam();
}
function tokPos(){return wpos(NODE_OF[BD.tokSt]);}
function placeTok(p){var t=document.getElementById("tok");if(t)t.style.transform="translate("+p.x.toFixed(1)+"px,"+p.y.toFixed(1)+"px) scale(calc(var(--iz) * var(--ns,1)))";}
function resizeBoard(first){
  var el=document.getElementById("board");if(!el)return;
  BD.cw=el.clientWidth||360;BD.ch=el.clientHeight||300;
  if(first){var p=tokPos();setCam(p.x,p.y,focusZ());BD.view="focus";placeTok(p);}
  else if(BD.view==="all")fitAll(0);
  else setCam(BD.cam.x,BD.cam.y,BD.cam.z);
  document.documentElement.style.setProperty("--bh",(window.innerWidth<900?el.offsetHeight+10:0)+"px");
}
function run(dur,step,done){
  if(!dur){step(1);if(done)done();return;}
  var t0=null;
  (function f(ts){
    if(t0===null)t0=ts;var t=Math.min(1,(ts-t0)/dur);step(t);
    if(t<1)requestAnimationFrame(f);else if(done)done();
  })(performance.now());
}
function flyTo(x,y,z,dur,cb){
  var c0={x:BD.cam.x,y:BD.cam.y,z:BD.cam.z};if(reduce())dur=0;
  BD.moving=true;
  run(dur,function(t){var e=ease(t);setCam(lerp(c0.x,x,e),lerp(c0.y,y,e),lerp(c0.z,z,e));},function(){BD.moving=false;if(cb)cb();});
}
function focusNode(k,dur){var p=wpos(k);BD.view="focus";flyTo(p.x,p.y,focusZ(),dur===undefined?700:dur);}
function fitAll(dur){BD.view="all";flyTo(BB.x0+BB.w/2,BB.y0+BB.h/2,fitZ(),dur===undefined?600:dur);}
function travel(i,cb){
  var from=NODE_OF[BD.tokSt],to=NODE_OF[i];
  if(from===to){BD.tokSt=i;updateBoard();if(cb)cb();return;}
  var A=wpos(from),B=wpos(to),b=bez(A,B,legSign(i-1)),dur=reduce()?0:Math.min(2800,1100+b.len*6);
  var c0={x:BD.cam.x,y:BD.cam.y,z:BD.cam.z},zf=focusZ(),app=document.getElementById("app");
  BD.moving=true;BD.view="focus";app.classList.add("is-moving");
  run(dur,function(t){
    var e=ease(t),p=b.at(e);placeTok(p);
    var f=Math.min(1,t*4),z=lerp(c0.z,zf,e)*(1-.3*Math.sin(Math.PI*t));
    setCam(lerp(c0.x,p.x,f),lerp(c0.y,p.y,f),z);
  },function(){
    BD.moving=false;BD.tokSt=i;app.classList.remove("is-moving");
    var p=wpos(to);placeTok(p);setCam(p.x,p.y,zf);updateBoard();if(cb)cb();
  });
}
function updateBoard(){
  if(!document.getElementById("bsv"))return;
  var fo=firstOpen(),selNode=NODE_OF[st.sel.i];
  Object.keys(NODES).forEach(function(k){
    var nd=NODES[k],g=document.getElementById("nd-"+k),tot=nd.sts.length,d=0,unl=0,cur=false;
    nd.sts.forEach(function(j){if(stDone(j))d++;if(stUnlocked(j))unl++;if(j===fo)cur=true;});
    var state=d===tot?"done":(unl===0?"lock":(cur?"cur":"part"));
    g.setAttribute("class","nd "+state+(k===selNode?" sel":""));
    g.querySelector(".np").setAttribute("stroke-dasharray",(d/tot*100).toFixed(1)+" 100");
    g.querySelector(".nt").textContent=state==="done"?"✓":(state==="lock"?"🔒":(tot===1?String(nd.sts[0]+1):d+"/"+tot));
    g.setAttribute("aria-label",nd.full+": "+d+" dari "+tot+" stasiun selesai"+(state==="lock"?", terkunci":(state==="cur"?", sedang dikerjakan":"")));
  });
  for(var i=0;i<S.length;i++){
    var lg=document.getElementById("lg-"+i);if(!lg)continue;
    lg.setAttribute("class","lg"+(BD.tokSt>i?" done":(i===fo-1?" next":"")));
  }
  if(!BD.moving)placeTok(tokPos());
}

(function(){
  var el=document.getElementById("board");if(!el)return;
  el.addEventListener("click",function(e){
    if(BD.drg){return;}
    var bc=e.target.closest("[data-bc]");
    if(bc){
      if(BD.moving)return;
      var a=bc.getAttribute("data-bc"),c=BD.cam;
      if(a==="me"){var p=tokPos();BD.view="focus";flyTo(p.x,p.y,focusZ(),500);}
      else if(a==="all")fitAll(500);
      else{BD.view="free";flyTo(c.x,c.y,c.z*(a==="zin"?1.5:1/1.5),250);}
      return;
    }
    var nd=e.target.closest("[data-node]");if(nd)pickNode(nd.getAttribute("data-node"));
  });
  el.addEventListener("keydown",function(e){
    if(e.key!=="Enter"&&e.key!==" ")return;
    var nd=e.target.closest&&e.target.closest("[data-node]");if(nd){e.preventDefault();pickNode(nd.getAttribute("data-node"));}
  });
  el.addEventListener("pointerdown",function(e){
    if(BD.moving||e.target.closest("[data-bc]"))return;
    BD.drag={x:e.clientX,y:e.clientY,cx:BD.cam.x,cy:BD.cam.y,id:e.pointerId,on:false};
  });
  el.addEventListener("pointermove",function(e){
    var d=BD.drag;if(!d)return;
    var dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!d.on&&Math.abs(dx)+Math.abs(dy)>6){d.on=true;try{el.setPointerCapture(d.id);}catch(x){}}
    if(d.on){BD.view="free";setCam(d.cx-dx/BD.cam.z,d.cy-dy/BD.cam.z,BD.cam.z);}
  });
  function end(){var d=BD.drag;BD.drag=null;if(d&&d.on){BD.drg=true;setTimeout(function(){BD.drg=false;},0);}}
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("wheel",function(e){
    if(BD.moving)return;e.preventDefault();BD.view="free";
    var c=BD.cam;setCam(c.x,c.y,c.z*(e.deltaY<0?1.15:1/1.15));
  },{passive:false});
})();

var M3=(function(){

var rig={x:0,z:0,d:60,phi:.82,az:0};

/* palet hipsometrik: [meter, warna] */
var PAL_REG=[[-1600,"#2d6a86"],[-300,"#4f93ad"],[-1,"#8cc3cf"],[0,"#efe3c6"],[250,"#e6d2a6"],[700,"#d6b783"],[1300,"#bf9461"],[1900,"#9c7348"],[2600,"#7d5b3c"]];

/* ---- Label HTML di atas kanvas ---- */
function addLabel(wd,html,cls,x,y,z,attrs,pri){
  var b=document.createElement(attrs&&attrs.btn?"button":"div");b.className="l3 "+cls;b.innerHTML=html;
  if(attrs)Object.keys(attrs).forEach(function(k){if(k!=="btn")b.setAttribute(k,attrs[k]);});
  b.style.display="none";ov.appendChild(b);var L={el:b,v:new T.Vector3(x,y,z),wd:wd,cls:cls,pri:pri||0,sz:{}};wd.labels.push(L);return L;
}
/* Label tidak boleh saling tumpuk: urut prioritas, coba di atas/bawah/kanan/kiri titik; kalau tetap tabrakan,
   label simpul diperkecil (hanya angka progres), label wilayah disembunyikan. */
var tmpV=null,GAP=14;
function rectOf(an,x,y,w,h){
  return an===0?[x-w/2,y-h-GAP,w,h]:an===1?[x-w/2,y+GAP*.6,w,h]:an===2?[x+GAP,y-h/2,w,h]:[x-GAP-w,y-h/2,w,h];
}
var ANT=["translate(-50%,calc(-100% - 14px))","translate(-50%,8px)","translate(14px,-50%)","translate(calc(-100% - 14px),-50%)"];
function hit(r,list){for(var i=0;i<list.length;i++){var q=list[i];if(r[0]<q[0]+q[2]+3&&q[0]<r[0]+r[2]+3&&r[1]<q[1]+q[3]+3&&q[1]<r[1]+r[3]+3)return true;}return false;}
function size(L,mini){var k=mini?"m":"f";if(!L.sz[k]){L.el.style.display="";L.el.classList.toggle("mini",!!mini);L.sz[k]=[L.el.offsetWidth,L.el.offsetHeight];}return L.sz[k];}
function placeLabels(){
  if(!world)return;tmpV=tmpV||new T.Vector3();
  Object.keys(worlds).forEach(function(k){worlds[k].labels.forEach(function(L){if(L.wd!==world)L.el.style.display="none";});});
  var vis=[];
  world.labels.forEach(function(L){
    tmpV.copy(L.v).project(cam);
    if(tmpV.z>1||Math.abs(tmpV.x)>1.1||Math.abs(tmpV.y)>1.1||L.hide){L.el.style.display="none";return;}
    L.x=(tmpV.x+1)/2*W;L.y=(1-tmpV.y)/2*H;vis.push(L);
  });
  vis.sort(function(a,b){return (b.pri+(b.el.classList.contains("sel")?3:0)+(b.el.classList.contains("cur")?2:0))-(a.pri+(a.el.classList.contains("sel")?3:0)+(a.el.classList.contains("cur")?2:0));});
  var placed=vis.map(function(L){return [L.x-9,L.y-9,18,18];});  /* titik penanda juga dihindari */
  vis.forEach(function(L){
    var mini=false,an=-1,s=size(L,false),cand=L.cls==="rg3"?[]:[0,1,2,3];
    if(L.cls==="rg3"){var r0=[L.x-s[0]/2,L.y-s[1]/2,s[0],s[1]];if(hit(r0,placed)){L.el.style.display="none";return;}placed.push(r0);
      L.el.style.display="";L.el.style.transform="translate("+L.x.toFixed(1)+"px,"+L.y.toFixed(1)+"px) translate(-50%,-50%)";return;}
    for(var c=0;c<cand.length&&an<0;c++){var r=rectOf(cand[c],L.x,L.y,s[0],s[1]);if(!hit(r,placed)){an=cand[c];placed.push(r);}}
    if(an<0){mini=true;s=size(L,true);for(c=0;c<cand.length&&an<0;c++){r=rectOf(cand[c],L.x,L.y,s[0],s[1]);if(!hit(r,placed)){an=cand[c];placed.push(r);}}
      if(an<0){L.el.style.display="none";return;}}   /* tetap bisa diketuk lewat penanda 3D (raycast) */
    L.el.classList.toggle("mini",mini);L.el.style.display="";
    L.el.style.transform="translate("+L.x.toFixed(1)+"px,"+L.y.toFixed(1)+"px) "+ANT[an];
  });
}

    if(k==="uh"){p.x+=.9;p.z-=.9;}            /* Uhud digeser skematis agar tidak menumpuk Madinah */
    p.y=wd.hAt(p.x,p.z);N[k]=p;
    var m=marker("#8a9690");m.position.set(p.x,p.y+.06,p.z);wd.root.add(m);wd.objs["m-"+k]=m;
    var L=addLabel(wd,'<span class="c"></span><span class="t">'+esc(n.n)+'</span>',"nd3",p.x,p.y+.1,p.z,{btn:1,id:"nd-"+k,"data-node":k,"aria-label":n.full},2);
    L.el.addEventListener("click",function(){if(onPick)onPick(k);});wd.objs["l-"+k]=L;
  });
  wd.N=N;wd.legs={};
  for(var i=0;i<S.length;i++){
    if(NODE_OF[i]===NODE_OF[i+1])continue;
    var a=N[NODE_OF[i]],b=N[NODE_OF[i+1]],pts=drape(wd,bezXZ(a,b,i%2?1:-1,48),.14);
    var base=ribbon(wd,pts,.085,"#fffaf0",.75),done=ribbon(wd,pts,.11,"#c98a1b",1);done.geometry.setDrawRange(0,0);
    wd.root.add(base);wd.root.add(done);wd.legs[i]={pts:pts,base:base,done:done};
  }
  [["LAUT MERAH",24.0,36.6],["HIJAZ",23.6,41.6],["NAJD",24.9,43.6],["SYAM",31.4,37.4]].forEach(function(r){
    var p=wd.P(r[1],r[2]);addLabel(wd,esc(r[0]),"rg3",p.x,wd.hAt(p.x,p.z)+.3,p.z);});
  var tok=pinMesh();wd.root.add(tok);wd.tok=tok;

function nodeState(k){
  var sts=NODES[k].sts,d=0;sts.forEach(function(j){if(doneF(j))d++;});
  var cur=sts.indexOf(tokSt)>-1;return {d:d,n:sts.length,cur:cur,all:d===sts.length};

function refreshRegion(){
  var wd=worlds.region;if(!wd)return;

  md:{t:"madinah",n:"Madinah",marks:[["md","Masjid Nabawi"],["qb","Quba’"],["uh","Gunung Uhud"],["sl","Bukit Sal’"],["dh","Dzul Hulaifah"]],maps:["mad","uhud","ahz"]}

  C.marks.forEach(function(m){
    var ll=PL[m[0]],p=wd.P(ll[0],ll[1]);p.y=wd.hAt(p.x,p.z);wd.marks[m[0]]=p;

function cityStory(mk){

  var m=MP[mk];if(!m||!m.r)return;
  var COLS={a:"#c98a1b",b:"#2f6f8f",c:"#a3362a"},all=[];
  (m.p||[]).forEach(function(q){var ll=PL[q[0]];if(ll)all.push(wd.P(ll[0],ll[1]));});
  m.r.forEach(function(r){

    for(var i=0;i<xz.length-1;i++){var seg=bezXZ(xz[i],xz[i+1],0,24);if(i)seg.shift();pts=pts.concat(seg);}

    if(r.a){var e=pts[pts.length-1],f=pts[pts.length-3],cn=new T.Mesh(new T.ConeGeometry(.45,1.1,16),new T.MeshBasicMaterial({color:COLS[r.c]||COLS.a}));
      var ang=Math.atan2(e.x-f.x,e.z-f.z);cn.rotation.set(Math.PI/2,0,0);var g=new T.Group();g.add(cn);g.rotation.y=ang;g.position.set(e.x,wd.hAt(e.x,e.z)+.45,e.z);wd.route.add(g);}

/* ---- Kamera ---- */
function applyCam(){
  var b=world.bounds;rig.x=clamp(rig.x,b.x0,b.x1);rig.z=clamp(rig.z,b.z0,b.z1);
  var dm=world.def.dist;rig.d=clamp(rig.d,dm[0],dm[1]);rig.phi=clamp(rig.phi,.15,1.12);
  var ty=world.hAt(rig.x,rig.z)*.6;
  cam.position.set(rig.x+Math.sin(rig.az)*Math.sin(rig.phi)*rig.d,ty+Math.cos(rig.phi)*rig.d,rig.z+Math.cos(rig.az)*Math.sin(rig.phi)*rig.d);
  cam.lookAt(rig.x,ty,rig.z);cam.near=rig.d*.02;cam.far=rig.d*8;cam.updateProjectionMatrix();
  scene.fog.near=rig.d*1.1;scene.fog.far=rig.d*3.6;
  var s=clamp(rig.d/world.def.mk,.35,2.6);
  if(world.tok)world.tok.scale.setScalar(s);
  world.root.traverse(function(o){if(o.userData.ring&&o.parent===world.root)o.scale.setScalar(s*(world.key==="region"?1:.8));});
  dirty=true;
}
function fly(to,ms,cb){
  var from={x:rig.x,z:rig.z,d:rig.d,phi:rig.phi};if(reduceM||!ms){Object.assign(rig,to);applyCam();if(cb)cb();return;}
  anim=anim.filter(function(a){return !a.fly;});
  anim.push({fly:1,t0:performance.now(),ms:ms,f:function(t){var e=ease(t);["x","z","d","phi"].forEach(function(k){if(to[k]!=null)rig[k]=lerp(from[k],to[k],e);});applyCam();},cb:cb});
  kick();
}

/* ---- Interaksi ---- */
var ptrs={},pinch=null,moved=0;
function wpp(){return 2*rig.d*Math.tan(cam.fov*Math.PI/360)/H;}
function bindInput(){
  cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;pinch=null;});
  cv.addEventListener("pointermove",function(e){
    var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
    if(ids.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y,k=wpp();moved+=Math.abs(dx)+Math.abs(dy);
      rig.x-=(dx*Math.cos(rig.az)+dy*Math.sin(rig.az))*k;rig.z-=(dy*Math.cos(rig.az)-dx*Math.sin(rig.az))*k/Math.max(.45,Math.cos(rig.phi*.8));applyCam();kick();}
    p.x=e.clientX;p.y=e.clientY;
    if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y),my=(a.y+b.y)/2;
      if(pinch){rig.d*=pinch.dd/(dd||1);rig.phi+=(my-pinch.my)*.006;applyCam();kick();}pinch={dd:dd,my:my};}
  });
  function up(e){var one=Object.keys(ptrs).length===1;delete ptrs[e.pointerId];pinch=null;if(one&&moved<6&&e.type==="pointerup")tap(e);}
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",function(e){e.preventDefault();rig.d*=Math.exp(e.deltaY*.0012);applyCam();kick();},{passive:false});
}
var ray=null;
function tap(e){
  if(view!=="region"||!onPick)return;var wd=worlds.region,r=cv.getBoundingClientRect();ray=ray||new T.Raycaster();
  ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
  var best=null,bd=1e9;Object.keys(NODES).forEach(function(k){var m=wd.objs["m-"+k],d=ray.ray.distanceToPoint(m.position),lim=1.4*m.scale.x;if(d<lim&&d<bd){bd=d;best=k;}});
  if(best)onPick(best);
}
function resize(){
  W=el.clientWidth;H=el.clientHeight;if(!W||!H)return;dpr=Math.min(window.devicePixelRatio||1,1.75);
  R.setPixelRatio(dpr);R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();dirty=true;kick();
}
function frame(t){
  raf=0;var busy=anim.length>0;
  for(var i=anim.length-1;i>=0;i--){var a=anim[i],p=Math.min(1,(t-a.t0)/a.ms);a.f(p);if(p>=1){anim.splice(i,1);if(a.cb)a.cb();}}
  var bob=world&&world.tok&&!reduceM&&!document.hidden;
  if(bob&&(busy||t-last>40)){world.tok.children.forEach(function(c,ix){if(ix<3)c.position.y=[.9,1.75,1.78][ix]+Math.sin(t/380)*.12;});dirty=true;}
  if(dirty){R.render(scene,cam);placeLabels();dirty=false;last=t;}
  if(anim.length||bob)raf=requestAnimationFrame(frame);

function kick(){if(!raf)raf=requestAnimationFrame(frame);}

/* ---- API ---- */
function supported(){try{var c=document.createElement("canvas");return !!(window.WebGLRenderingContext&&(c.getContext("webgl2")||c.getContext("webgl")));}catch(e){return false;}}
var DEF={
  region:{unit:10,ex:.00075,base:0,edge:.08,pal:function(v){return palette(PAL_REG,v);},sea:"#5c9fb8",dist:[9,140],mk:45},
  makkah:{unit:340,ex:.0062,edge:.2,fit:78,pal:null,dist:[12,120],mk:45},
  madinah:{unit:340,ex:.0062,edge:.2,fit:78,pal:null,dist:[12,120],mk:45}

function cityPal(md){var lo=md.min,hi=md.max;return function(v){var t=(v-lo)/((hi-lo)||1);
  return palette([[0,"#efe1bf"],[.18,"#e2c999"],[.45,"#c9a271"],[.75,"#a7794b"],[1,"#86613f"]],t);};}

  });

function setState(o){if(o.tokSt!=null)tokSt=o.tokSt;if(o.sel!=null)sel=o.sel;refreshRegion();kick();}
function focusNode(k,ms){var wd=worlds.region;if(!wd||view!=="region")return;var p=wd.N[k];fly({x:p.x,z:p.z+2,d:Math.min(rig.d,34),phi:.85},ms==null?900:ms);}

/* Token berjalan dari stasiun a ke b, rute digambar bertahap, kamera mengikuti */
function travel(a,b,cb){
  var wd=worlds.region;if(!wd||view!=="region"){tokSt=b;refreshRegion();if(cb)cb();return;}
  var legs=[];for(var i=a;i<b;i++)if(wd.legs[i])legs.push(i);
  if(reduceM||!legs.length){tokSt=b;refreshRegion();focusNode(NODE_OF[b],0);if(cb)cb();return;}
  var n=0;
  (function next(){
    if(n>=legs.length){tokSt=b;refreshRegion();if(cb)cb();return;}
    var L=wd.legs[legs[n]],pts=L.pts,tot=L.done.userData.total,ms=clamp(6500/legs.length,900,1700);L.anim=true;
    rig.d=Math.max(Math.min(rig.d,40),24);
    anim.push({t0:performance.now(),ms:ms,f:function(t){
      var e=ease(t),f=e*(pts.length-1),i0=Math.floor(f),u=f-i0,p0=pts[i0],p1=pts[Math.min(i0+1,pts.length-1)];
      var x=lerp(p0.x,p1.x,u),z=lerp(p0.z,p1.z,u);wd.tok.position.set(x,wd.hAt(x,z),z);
      L.done.geometry.setDrawRange(0,Math.floor(tot*e/6)*6);rig.x=x;rig.z=z+2;applyCam();},
      cb:function(){L.anim=false;n++;next();}});
    kick();

function enterCity(k){
  var ck=cityOf(k);if(!ck)return false;var C=CITY[ck];
  function go(wd){
    worlds.region.root.visible=false;wd.root.visible=true;world=wd;view=ck;
    var p=wd.marks[ck==="mk"?"mk":"md"];rig.x=p.x;rig.z=p.z;rig.d=110;rig.phi=.4;applyCam();
    fitPts(Object.keys(wd.marks).map(function(k){return wd.marks[k];}),1300);
    el.classList.add("incity");if(onCity)onCity(ck);
  }
  if(worlds[ck])go(worlds[ck]);
  else makeWorld(C.t,DEF[C.t],function(wd){worlds[ck]=wd;buildCity(wd,ck);scene.add(wd.root);go(wd);});
  return true;
}
function exitCity(){
  if(view==="region")return;var k=view;worlds[k].root.visible=false;worlds.region.root.visible=true;world=worlds.region;view="region";
  el.classList.remove("incity");var p=worlds.region.N[k];rig.x=p.x;rig.z=p.z+1;rig.d=14;rig.phi=.7;applyCam();fly({d:34,phi:.85},reduceM?0:900);if(onCity)onCity(null);

/* Bingkai kamera agar semua titik (x,z) masuk layar */
function fitPts(pts,ms){
  var x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;pts.forEach(function(p){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);});
  var w=(x1-x0)*1.5+10,h=(z1-z0)*1.5+10,t=Math.tan(cam.fov*Math.PI/360),phi=.78,
      d=Math.max(h/(2*t)/Math.max(.55,Math.cos(phi*.6)),w/(2*t*cam.aspect));
  /* geser sedikit ke kanan agar isi peta tidak tertutup tombol kontrol di sisi kanan */
  var rg=world&&world.key==="region";if(!rg)d=Math.min(d,world.def.fit||d);
  fly({x:(x0+x1)/2+w*.05,z:(z0+z1)/2+(rg?d*.06:0),d:d,phi:rg?phi:.7},reduceM?0:(ms==null?900:ms));
}
function zoom(f){rig.d*=f;applyCam();kick();}
function tilt(){fly({phi:rig.phi>.5?.12:.85},600);}
return {init:init,setState:setState,focusNode:focusNode,overview:overview,travel:travel,enterCity:enterCity,exitCity:exitCity,
  cityOf:cityOf,CITY:CITY,fitPts:fitPts,story:cityStory,zoom:zoom,tilt:tilt,view:function(){return view;},busy:function(){return anim.length>0;}};
})();

/* ---------- Halaman prototipe peta 3D: timeline stasiun, kartu info, tampilan kota ----------
   Membaca progres dari localStorage versi utama (hanya baca). Simulasi perjalanan tidak disimpan. */
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var P3={mode:"s",qd:{},tl:false,sel:0,tok:0,city:null};
(function(){try{var o=JSON.parse(localStorage.getItem("peta-sirah-v2")||"null");if(o&&o.prog){P3.mode=o.mode==="d"?"d":"s";var p=o.prog[P3.mode]||{};P3.qd=p.qd||{};P3.tl=!!p.tl;}}catch(e){}})();
function done3(i){return i===S.length?P3.tl:(P3.qd[i]||0)>=3;}
function front3(){for(var i=0;i<S.length;i++)if(!done3(i))return i;return S.length;}
P3.tok=front3();P3.sel=P3.tok;
function band3(i){for(var b=0;b<BANDS.length;b++)if(i>=BANDS[b].from&&i<=BANDS[b].to)return BANDS[b].t;return "Ujian akhir";}
function title3(i){return i===S.length?"Ujian urutan peristiwa":S[i].t;}
function tlHTML(){
  var h="";
  BANDS.concat([{t:"Penutup",from:S.length,to:S.length}]).forEach(function(b){
    h+='<div class="bd3"><span class="bt3">'+esc(b.t)+'</span><div class="ch3">';
    for(var i=b.from;i<=b.to;i++){
      var c=done3(i)?"done":i===P3.tok?"cur":"";
      h+='<button class="sc3 '+c+(i===P3.sel?" sel":"")+'" data-st="'+i+'" aria-pressed="'+(i===P3.sel)+'" title="'+esc(title3(i))+'">'+
        '<b>'+(i===S.length?"✓":i+1)+'</b><span>'+esc(title3(i))+'</span><i>'+esc(NODES[NODE_OF[i]].n)+'</i></button>';
    }
    h+='</div></div>';
  });
  return h;
}
function infoHTML(){
  if(P3.city){
    var C=M3.CITY[P3.city];
    var h='<p class="k3">Kota · tampilan detail</p><h2>'+esc(C.n)+'</h2><p class="mut3">Relief dari data ketinggian nyata (dibesarkan agar terbaca). Titik tempat perkiraan'+(P3.city==="mk"?"; Ka’bah berupa simbol, tidak berskala":"")+'.</p>';
    h+='<div class="sty3" role="group" aria-label="Kisah di kota ini">'+C.maps.map(function(m){return '<button data-story="'+m+'" aria-pressed="'+(P3.story===m)+'">'+esc(MP[m].t)+'</button>';}).join("")+'</div>';
    if(P3.story){var m=MP[P3.story];
      h+=(m.r||[]).map(function(r){return '<p class="lg3"><i class="c-'+r.c+'"></i>'+esc(r.l||"")+'</p>';}).join("")+'<p class="nt3">'+esc(m.n)+'</p>';
      var sts=[];Object.keys(SM).forEach(function(k){if(SM[k].indexOf(P3.story)>-1)sts.push(+k);});
      h+=sts.map(function(j){return '<button class="go3" data-st="'+j+'">Stasiun '+(j+1)+': '+esc(S[j].t)+'</button>';}).join("");
    }
    return h;
  }
  var i=P3.sel,k=NODE_OF[i],h='<p class="k3">Stasiun '+(i===S.length?"akhir":i+1)+' · '+esc(band3(i))+'</p><h2>'+esc(title3(i))+'</h2>';
  if(i<S.length){
    h+='<p class="mut3">'+esc(S[i].lok)+' · hlm. '+esc(S[i].hlm)+'</p><p>'+esc(S[i].r[P3.mode]||S[i].r.s)+'</p>';
  }else h+='<p>Susun peristiwa-peristiwa sirah sesuai urutannya. Terbuka setelah semua stasiun selesai.</p>';
  h+='<div class="act3">';
  if(M3.cityOf(k))h+='<button class="btn" data-a="city">Masuk kota '+esc(M3.CITY[M3.cityOf(k)].n)+'</button>';
  if(i!==P3.tok)h+='<button class="btn ghost" data-a="sim">Simulasikan perjalanan ke sini</button>';
  h+='</div><p class="mut3 sm3">Status: '+(done3(i)?"selesai":i===P3.tok?"posisi sekarang":i<P3.tok?"terbuka":"terkunci di versi utama")+'.</p>';
  return h;
}
function draw3(){document.getElementById("tl3").innerHTML=tlHTML();document.getElementById("info3").innerHTML=infoHTML();
  var s=document.querySelector(".sc3.sel");if(s&&s.scrollIntoView)s.scrollIntoView({block:"nearest",inline:"center"});}
function pick3(i,fly){P3.sel=i;M3.setState({sel:i});if(fly!==false&&M3.view()==="region")M3.focusNode(NODE_OF[i]);draw3();}
function start3(){
  var box=document.getElementById("m3");
  var ok=M3.init(box,{done:done3,
    onPick:function(k){var sts=NODES[k].sts,j=sts.indexOf(P3.tok)>-1?P3.tok:sts[0];pick3(j);},
    onCity:function(ck){P3.city=ck;P3.story=ck?M3.CITY[ck].maps[0]:null;if(ck)M3.story(P3.story);document.getElementById("back3").hidden=!ck;draw3();},
    ready:function(){document.getElementById("m3").classList.add("ready");}});
  if(!ok){box.innerHTML='<p class="no3">Perangkat ini belum mendukung WebGL, jadi peta 3D tidak bisa tampil. <a href="index.html">Buka versi utama (peta 2D)</a>.</p>';}
  M3.setState({tokSt:P3.tok,sel:P3.sel});draw3();
  document.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.st!=null){if(P3.city)M3.exitCity();pick3(+b.dataset.st);return;}
    if(b.dataset.story){P3.story=b.dataset.story;M3.story(P3.story);draw3();return;}
    var a=b.dataset.a||b.dataset.c;
    if(a==="city")M3.enterCity(NODE_OF[P3.sel]);
    else if(a==="sim"){var to=P3.sel,from=P3.tok;if(to<from){P3.tok=to;M3.setState({tokSt:to});M3.focusNode(NODE_OF[to]);draw3();return;}
      M3.travel(from,to,function(){P3.tok=to;draw3();});}
    else if(a==="back")M3.exitCity();
    else if(a==="zin")M3.zoom(.7);else if(a==="zout")M3.zoom(1.4);
    else if(a==="me")M3.focusNode(NODE_OF[P3.tok]);else if(a==="all")M3.overview();else if(a==="tilt")M3.tilt();
  });
}
document.addEventListener("DOMContentLoaded",start3);

</script>
</body>
</html>
