name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npm run web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PetaSirah.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PetaSirah-apk
          path: PetaSirah.apk
      - name: Publikasikan ke Release (link unduhan tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-terbaru' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Peta Sirah (APK terbaru)' }}
          body: "APK debug Peta Sirah Nabawiyah. Unduh PetaSirah.apk di bawah, izinkan install dari sumber tidak dikenal, lalu buka."
          files: PetaSirah.apk
          overwrite_files: true
